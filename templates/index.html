<script>
    const EXTRA_SETTINGS_STORAGE_KEY = "sammyreks_extra_app_settings_v1";
    const DELETED_CHAT_PHOTOS_KEY = "sammyreks_deleted_chat_photo_ids_v1";
    const PAID_DEBTOR_IDS_KEY = "sammyreks_paid_debtor_ids_v1";
    const VENDOR_OVERRIDES_STORAGE_KEY = "sammyreks_product_vendor_overrides_v1";

    const DEFAULT_EXTRA_SETTINGS = {
      showBusinessAnalytics: false,
      showInventoryAlerts: true,
      lowStockThreshold: 2,
      showTabShop: true,
      showTabRequest: true,
      showTabChat: true,
      showTabCart: true,
      showDockCartBadge: true,
      showTopCartBtn: true,
      mobileTabLabels: "Shop | Request | Chat & Receipts | Checkout",
      showWatchAd: true,
      showVendorBadges: true,
      showStockOnCards: true,
      hideOutOfStock: false,
      searchPlaceholder: "Search products...",
      paymentInstructions: "",
      chatHelperSubtitle: "First time here? Place an order in Checkout or Request first—your private chat unlocks automatically with your new PIN!",
      autoPinMode: true,
      pinFieldLabel: "4-Digit Chat PIN (Leave blank — auto-generated)",
      orderNotePlaceholder: "Optional delivery address or note...",
      footerText: "",
      receiptFooter: "Thank you for your patronage!",
      showRotatingTicker: true,
      tickerIntervalSec: 5,
      tickerMessages: "",
      showAwarenessFloat: false,
      awarenessAutoSlide: false,
      awarenessImageUrl: "",
      awarenessCaption: "",
    };

    const DEFAULT_ROTATING_TIPS = [
      { badge: "Did You Know?", text: "Buying full cartons or packs often lowers your unit cost compared to single retail units." },
      { badge: "Smart Tip", text: "Every order generates a private Chat PIN and Order Reference so your chat and receipts stay protected." },
      { badge: "Motivation", text: "Consistent daily progress builds strong businesses and lasting results." },
      { badge: "Good to Know", text: "After transferring payment, upload your proof screenshot in Chat & Receipts for quick verification." },
      { badge: "Did You Know?", text: "Tap Watch Ad on any product card with a video to preview the item before ordering." },
    ];

    const state = {
      products: [],
      cart: [],
      ordersFeed: [],
      ordersFilter: "all",
      staffMessagesFeed: [],
      debtorsList: [],
      expensesList: [],
      workersList: [],
      paidDebtorIds: new Set(),
      deletedPhotoIds: new Set(),
      vendorOverrides: {},
      pendingWhatsAppReceipt: null,
      awarenessDismissed: false,
      isLoggedIn: false,
      user: null,
      staffToken: "",
      customerAuth: {
        unlocked: false,
        phone: "",
        pin: "",
      },
      currency: "\u20a6",
      businessName: "Sammyreks Business Center",
      extraSettings: { ...DEFAULT_EXTRA_SETTINGS },
      busyKeys: new Set(),
      lastSubmitAt: new Map(),
    };

    let _tickerTimerId = null;
    let _tickerIndex = 0;
    let _awarenessSlideIndex = 0;
    let _awarenessAutoTimerId = null;
    let _awarenessDragActive = false;
    let _awarenessDragMoved = false;
    let _awarenessPointerStartX = 0;
    let _awarenessPointerStartY = 0;
    let _awarenessOffsetX = 0;
    let _awarenessOffsetY = 0;
    let _awarenessBaseOffsetX = 0;
    let _awarenessBaseOffsetY = 0;

    function byId(id) {
      return document.getElementById(id);
    }

    function setElValue(id, value) {
      const el = byId(id);
      if (el) el.value = value;
      return el;
    }

    function setElChecked(id, checked) {
      const el = byId(id);
      if (el) el.checked = Boolean(checked);
      return el;
    }

    function setElText(id, text) {
      const el = byId(id);
      if (el) el.textContent = text;
      return el;
    }

    function setElHidden(id, hidden) {
      const el = byId(id);
      if (el) el.classList.toggle("d-none", Boolean(hidden));
      return el;
    }

    function onEl(id, eventName, handler) {
      const el = byId(id);
      if (!el) return null;
      el.addEventListener(eventName, handler);
      return el;
    }

    function createSafeModal(id) {
      const el = byId(id);
      if (!el || typeof bootstrap === "undefined" || !bootstrap.Modal) {
        return {
          show() {},
          hide() {},
        };
      }
      try {
        return new bootstrap.Modal(el);
      } catch (_) {
        return {
          show() {},
          hide() {},
        };
      }
    }

    function applyAwarenessPosition() {
      const card = byId("customerAwarenessFloat");
      if (!card) return;
      card.style.transform = `translate3d(${_awarenessOffsetX}px, ${_awarenessOffsetY}px, 0)`;
    }

    function resetAwarenessPosition() {
      _awarenessOffsetX = 0;
      _awarenessOffsetY = 0;
      _awarenessBaseOffsetX = 0;
      _awarenessBaseOffsetY = 0;
      applyAwarenessPosition();
    }

    function normalizeTickerIntervalSec(rawVal) {
      const parsed = parseInt(rawVal ?? 5, 10);
      if (!Number.isFinite(parsed)) return 5;
      return Math.max(2, Math.min(3600, parsed));
    }

    function getRotatingTickerItems() {
      const combined = [...DEFAULT_ROTATING_TIPS];
      const customRaw = String(state.extraSettings?.tickerMessages || "").trim();
      if (customRaw) {
        const fallbackBadges = ["Did You Know?", "Smart Tip", "Motivation", "Store Note"];
        customRaw
          .split(/\||\r?\n/)
          .map((item) => item.trim())
          .filter(Boolean)
          .forEach((line, idx) => {
            const colonIdx = line.indexOf(":");
            if (colonIdx > 0 && colonIdx <= 25) {
              combined.push({
                badge: line.slice(0, colonIdx).trim(),
                text: line.slice(colonIdx + 1).trim(),
              });
            } else {
              combined.push({
                badge: fallbackBadges[idx % fallbackBadges.length],
                text: line,
              });
            }
          });
      }
      return combined;
    }

    function startRotatingTicker() {
      const banner = byId("customerTickerBanner");
      const badgeEl = byId("customerTickerBadge");
      const textEl = byId("customerTickerText");
      const timerLabel = byId("customerTickerTimerLabel");
      if (!banner || !badgeEl || !textEl) return;

      if (_tickerTimerId) {
        clearInterval(_tickerTimerId);
        _tickerTimerId = null;
      }

      if (state.extraSettings?.showRotatingTicker === false) {
        banner.classList.add("d-none");
        return;
      }

      const items = getRotatingTickerItems();
      if (!items.length) {
        banner.classList.add("d-none");
        return;
      }

      const intervalSec = normalizeTickerIntervalSec(state.extraSettings?.tickerIntervalSec);
      if (timerLabel) {
        timerLabel.innerHTML = `<i class="fa-solid fa-rotate me-1"></i>${intervalSec}s`;
      }

      banner.classList.remove("d-none");
      _tickerIndex = 0;

      const showCurrentSlide = () => {
        const current = items[_tickerIndex % items.length];
        textEl.style.opacity = "0";
        setTimeout(() => {
          badgeEl.textContent = current.badge;
          textEl.textContent = current.text;
          textEl.style.opacity = "1";
        }, 120);
        _tickerIndex = (_tickerIndex + 1) % items.length;
      };

      showCurrentSlide();
      _tickerTimerId = setInterval(showCurrentSlide, intervalSec * 1000);
    }

    function isSafeImageSrc(url) {
      const clean = String(url || "").trim();
      if (!clean) return false;
      if (clean.startsWith("https://") || clean.startsWith("http://") || clean.startsWith("/")) {
        return true;
      }
      if (/^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=]+$/i.test(clean)) {
        return true;
      }
      return false;
    }

    function parseAwarenessList(rawVal) {
      if (Array.isArray(rawVal)) {
        return rawVal.map((v) => String(v || "").trim()).filter(Boolean);
      }
      return String(rawVal || "")
        .split(/\||\r?\n/)
        .map((s) => s.trim())
        .filter(Boolean);
    }

    function getAwarenessSlides() {
      const cfg = state.extraSettings || {};
      const imgs = parseAwarenessList(cfg.awarenessImageUrl).filter(isSafeImageSrc);
      const captions = parseAwarenessList(cfg.awarenessCaption);
      return imgs.map((src, idx) => ({
        src,
        caption: captions[idx] || captions[0] || "",
      }));
    }

    function stepAwarenessSlide(delta) {
      const slides = getAwarenessSlides();
      if (!slides.length) return;
      _awarenessSlideIndex = (_awarenessSlideIndex + delta + slides.length) % slides.length;
      renderFloatingAwarenessCard();
    }

    function renderFloatingAwarenessCard() {
      const card = byId("customerAwarenessFloat");
      const imgEl = byId("customerAwarenessImg");
      const capEl = byId("customerAwarenessCaption");
      const navBar = byId("customerAwarenessNavBar");
      const counterEl = byId("customerAwarenessCounter");
      if (!card || !imgEl || !capEl) return;

      if (_awarenessAutoTimerId) {
        clearInterval(_awarenessAutoTimerId);
        _awarenessAutoTimerId = null;
      }

      const cfg = state.extraSettings || {};
      const slides = getAwarenessSlides();

      if (!cfg.showAwarenessFloat || state.awarenessDismissed || !slides.length) {
        card.classList.add("d-none");
        imgEl.removeAttribute("src");
        return;
      }

      if (_awarenessSlideIndex >= slides.length) _awarenessSlideIndex = 0;
      const current = slides[_awarenessSlideIndex];

      imgEl.src = current.src;
      if (current.caption) {
        capEl.textContent = current.caption;
        capEl.classList.remove("d-none");
      } else {
        capEl.textContent = "";
        capEl.classList.add("d-none");
      }

      if (navBar && counterEl) {
        if (slides.length > 1) {
          navBar.classList.remove("d-none");
          counterEl.textContent = `${_awarenessSlideIndex + 1} / ${slides.length}`;
        } else {
          navBar.classList.add("d-none");
        }
      }

      applyAwarenessPosition();
      card.classList.remove("d-none");

      if (cfg.awarenessAutoSlide && slides.length > 1) {
        _awarenessAutoTimerId = setInterval(() => stepAwarenessSlide(1), 5000);
      }
    }

    function readAwarenessFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          resolve("");
          return;
        }
        if (!String(file.type || "").startsWith("image/")) {
          reject(new Error("Please choose a valid image file (PNG, JPG, WEBP)."));
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 720;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.82));
          };
          img.onerror = () => reject(new Error("Could not read selected awareness image."));
          img.src = String(reader.result || "");
        };
        reader.onerror = () => reject(new Error("Failed to load selected awareness image."));
        reader.readAsDataURL(file);
      });
    }

    async function readAwarenessFilesAsDataUrls(fileList) {
      const files = Array.from(fileList || []);
      const results = [];
      for (const file of files) {
        const dataUrl = await readAwarenessFileAsDataUrl(file);
        if (dataUrl) results.push(dataUrl);
      }
      return results;
    }

    const productAdModalEl = byId("productAdModal");
    const productAdModal = createSafeModal("productAdModal");
    const thermalReceiptModal = createSafeModal("thermalReceiptModal");

    if (productAdModalEl) {
      productAdModalEl.addEventListener("hidden.bs.modal", () => {
        const body = byId("productAdModalBody");
        if (body) body.innerHTML = "";
      });
    }

    function formatMoney(amount) {
      const num = Number(amount || 0);
      const safeNum = Number.isFinite(num) ? num : 0;
      return `${state.currency || "\u20a6"}${safeNum.toFixed(2)}`;
    }

    function readIdSetFromStorage(key) {
      try {
        const raw = localStorage.getItem(key);
        const arr = raw ? JSON.parse(raw) : [];
        return new Set(Array.isArray(arr) ? arr.map(String) : []);
      } catch (_) {
        return new Set();
      }
    }

    function saveIdSetToStorage(key, idSet) {
      try {
        localStorage.setItem(key, JSON.stringify(Array.from(idSet)));
      } catch (_) {}
    }

    function readVendorOverrides() {
      try {
        const raw = localStorage.getItem(VENDOR_OVERRIDES_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (_) {
        return {};
      }
    }

    function saveVendorOverride(prodId, prodName, vendorName) {
      const cleanVendor = String(vendorName || "").trim();
      if (prodId) {
        state.vendorOverrides[`id:${String(prodId)}`] = cleanVendor;
      }
      if (prodName) {
        state.vendorOverrides[`name:${String(prodName).trim().toLowerCase()}`] = cleanVendor;
      }
      try {
        localStorage.setItem(VENDOR_OVERRIDES_STORAGE_KEY, JSON.stringify(state.vendorOverrides));
      } catch (_) {}
    }

    function resolveVendorName(rawItem, id, name) {
      const serverVal = String(rawItem?.vendor_name ?? rawItem?.vendor ?? rawItem?.sponsor ?? "").trim();
      const byId = id ? state.vendorOverrides[`id:${String(id)}`] : undefined;
      const byName = name ? state.vendorOverrides[`name:${String(name).trim().toLowerCase()}`] : undefined;
      if (byId !== undefined) return byId;
      if (byName !== undefined) return byName;
      return serverVal;
    }

    function getProductAlertInfo(p) {
      const threshold = Math.max(0, Number(state.extraSettings.lowStockThreshold ?? 2));
      const stockVal = Number(p.qty_cartons ?? p.stock ?? 0);
      const isLowStock = stockVal <= threshold;

      let isExpired = false;
      let isExpiringSoon = false;
      let daysLeft = null;
      const expStr = String(p.expiry || "").trim();
      if (expStr && !["none", "nan", "null", "-"].includes(expStr.toLowerCase())) {
        const expDate = new Date(expStr + "T23:59:59");
        if (!Number.isNaN(expDate.getTime())) {
          const diffMs = expDate.getTime() - Date.now();
          daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
          if (daysLeft < 0) {
            isExpired = true;
          } else if (daysLeft <= 30) {
            isExpiringSoon = true;
          }
        }
      }

      return { isLowStock, stockVal, isExpired, isExpiringSoon, daysLeft, expStr };
    }

    function renderInventoryAlerts() {
      const card = byId("inventoryAlertsCard");
      const badge = byId("inventoryAlertsBadge");
      const listEl = byId("inventoryAlertsList");
      if (!card || !badge || !listEl) return;

      if (!state.isLoggedIn || !state.extraSettings.showInventoryAlerts) {
        card.classList.add("d-none");
        return;
      }

      const alerts = [];
      for (const p of state.products || []) {
        const info = getProductAlertInfo(p);
        if (info.isLowStock) {
          alerts.push({
            type: info.stockVal <= 0 ? "Out of Stock" : "Low Stock",
            badgeClass: info.stockVal <= 0 ? "bg-danger" : "bg-warning text-dark",
            text: `${p.name} — ${info.stockVal.toFixed(2)} ${p.unit_main_label || "Carton"}(s) left${p.shelf ? ` (Shelf: ${p.shelf})` : ""}`,
          });
        }
        if (info.isExpired) {
          alerts.push({
            type: "Expired",
            badgeClass: "bg-danger",
            text: `${p.name} — Expired on ${info.expStr}`,
          });
        } else if (info.isExpiringSoon) {
          alerts.push({
            type: "Expiring Soon",
            badgeClass: "bg-warning text-dark",
            text: `${p.name} — Expires in ${info.daysLeft} day(s) (${info.expStr})`,
          });
        }
      }

      if (!alerts.length) {
        card.classList.add("d-none");
        return;
      }

      badge.textContent = `${alerts.length} Alert${alerts.length === 1 ? "" : "s"}`;
      listEl.innerHTML = alerts
        .slice(0, 8)
        .map(
          (a) =>
            `<div class="d-flex align-items-center gap-2 mb-1"><span class="badge ${a.badgeClass}">${escapeHtml(a.type)}</span><span>${escapeHtml(a.text)}</span></div>`
        )
        .join("") + (alerts.length > 8 ? `<div class="text-muted mt-1">+ ${alerts.length - 8} more item alert(s) in Saved Inventory below.</div>` : "");
      card.classList.remove("d-none");
    }

    function renderAnalyticsMetrics({ totalRevenue = 0, totalProfit = 0, totalExpenses = 0, netCashflow = 0 }) {
      setElText("metricTotalRevenue", formatMoney(totalRevenue));
      setElText("metricTotalProfit", formatMoney(totalProfit));
      setElText("metricTotalExpenses", formatMoney(totalExpenses));
      setElText("metricNetCashflow", formatMoney(netCashflow));
    }

    async function loadBusinessAnalytics() {
      if (!state.isLoggedIn || !state.extraSettings.showBusinessAnalytics) {
        return;
      }

      try {
        const analyticsRes = await apiRequest("/api/analytics");
        const src = analyticsRes.analytics || analyticsRes.data || analyticsRes || {};
        if (
          src.total_revenue !== undefined ||
          src.revenue !== undefined ||
          src.net_cashflow !== undefined ||
          src.cashflow !== undefined
        ) {
          const rev = Number(src.total_revenue ?? src.revenue ?? 0);
          const prof = Number(src.total_profit ?? src.profit ?? 0);
          const exp = Number(src.total_expenses ?? src.expenses ?? 0);
          const cash = Number(src.net_cashflow ?? src.cashflow ?? (prof || rev) - exp);
          renderAnalyticsMetrics({
            totalRevenue: rev,
            totalProfit: prof,
            totalExpenses: exp,
            netCashflow: cash,
          });
          return;
        }
      } catch (_) {}

      try {
        const [salesRes, expensesRes] = await Promise.all([
          apiRequest("/api/sales").catch(() => ({})),
          apiRequest("/api/expenses").catch(() => ({})),
        ]);

        const salesList = Array.isArray(salesRes.sales)
          ? salesRes.sales
          : Array.isArray(salesRes.data)
            ? salesRes.data
            : [];
        const expensesList = Array.isArray(expensesRes.expenses)
          ? expensesRes.expenses
          : Array.isArray(expensesRes.data)
            ? expensesRes.data
            : [];

        const costByProductId = new Map();
        const costByProductName = new Map();
        for (const p of state.products || []) {
          const packsPerCarton = Math.max(1, Number(p.packs_per_carton ?? 1));
          const retailPerPack = Math.max(1, Number(p.units_per_pack ?? 1));
          const cartonCost = Number(p.cost ?? 0);
          const packCost = cartonCost / packsPerCarton;
          const retailCost = packCost / retailPerPack;

          if (p.id) {
            costByProductId.set(String(p.id), {
              mainUnit: p.unit_main_label || "Carton",
              packUnit: p.unit_pack_label || "Pack",
              cartonCost,
              packCost,
              retailCost,
            });
          }
          if (p.name) {
            costByProductName.set(String(p.name).trim().toLowerCase(), {
              mainUnit: p.unit_main_label || "Carton",
              packUnit: p.unit_pack_label || "Pack",
              cartonCost,
              packCost,
              retailCost,
            });
          }
        }

        let totalRevenue = 0;
        let totalProfit = 0;

        for (const s of salesList) {
          if (s && (s.record_debt === true || String(s.status || "").toLowerCase() === "debt")) {
            continue;
          }
          const qty = Math.max(0, Number(s.qty ?? s.quantity ?? 1));
          const rowTotal = Number(s.total ?? s.amount ?? (Number(s.unit_price ?? s.price ?? 0) * qty));
          totalRevenue += Number.isFinite(rowTotal) ? rowTotal : 0;

          if (s.profit !== undefined && s.profit !== null && s.profit !== "") {
            totalProfit += Number(s.profit) || 0;
          } else {
            const meta =
              (s.product_id && costByProductId.get(String(s.product_id))) ||
              ((s.item_name || s.name) && costByProductName.get(String(s.item_name || s.name).trim().toLowerCase())) ||
              null;
            if (meta) {
              const unitType = String(s.unit_type ?? s.unit ?? "");
              let unitCost = meta.retailCost;
              if (unitType === meta.mainUnit || unitType.toLowerCase() === "carton") {
                unitCost = meta.cartonCost;
              } else if (unitType === meta.packUnit || unitType.toLowerCase() === "pack") {
                unitCost = meta.packCost;
              }
              totalProfit += rowTotal - unitCost * qty;
            }
          }
        }

        let totalExpenses = 0;
        for (const ex of expensesList) {
          const exAmt = Number(ex.amount ?? ex.cost ?? 0);
          totalExpenses += Number.isFinite(exAmt) ? exAmt : 0;
        }

        const netCashflow = (salesList.length > 0 ? totalProfit : totalRevenue) - totalExpenses;
        renderAnalyticsMetrics({
          totalRevenue,
          totalProfit,
          totalExpenses,
          netCashflow,
        });
      } catch (_) {
        renderAnalyticsMetrics({
          totalRevenue: 0,
          totalProfit: 0,
          totalExpenses: 0,
          netCashflow: 0,
        });
      }
    }

    function readLocalExtraSettings() {
      try {
        const raw = localStorage.getItem(EXTRA_SETTINGS_STORAGE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (_) {
        return {};
      }
    }

    function saveLocalExtraSettings(cfg) {
      try {
        localStorage.setItem(EXTRA_SETTINGS_STORAGE_KEY, JSON.stringify(cfg));
      } catch (_) {}
    }

    function applyExtraSettingsToUI() {
      const cfg = { ...DEFAULT_EXTRA_SETTINGS, ...(state.extraSettings || {}) };
      cfg.tickerIntervalSec = normalizeTickerIntervalSec(cfg.tickerIntervalSec);
      state.extraSettings = cfg;

      setElValue("setCurrency", state.currency || "\u20a6");
      setElValue("setFooterText", cfg.footerText || "");
      setElValue("setReceiptFooter", cfg.receiptFooter || "Thank you for your patronage!");
      setElChecked("setShowBusinessAnalytics", cfg.showBusinessAnalytics);
      setElChecked("setShowInventoryAlerts", cfg.showInventoryAlerts);
      setElValue("setLowStockThreshold", Number(cfg.lowStockThreshold ?? 2));
      setElChecked("setShowTabShop", cfg.showTabShop);
      setElChecked("setShowTabRequest", cfg.showTabRequest);
      setElChecked("setShowTabChat", cfg.showTabChat);
      setElChecked("setShowTabCart", cfg.showTabCart);
      setElChecked("setShowDockCartBadge", cfg.showDockCartBadge);
      setElChecked("setShowTopCartBtn", cfg.showTopCartBtn);
      setElValue("setMobileTabLabels", cfg.mobileTabLabels || DEFAULT_EXTRA_SETTINGS.mobileTabLabels);
      setElChecked("setShowWatchAd", cfg.showWatchAd);
      setElChecked("setShowVendorBadges", cfg.showVendorBadges);
      setElChecked("setShowStockOnCards", cfg.showStockOnCards);
      setElChecked("setHideOutOfStock", cfg.hideOutOfStock);
      setElValue("setSearchPlaceholder", cfg.searchPlaceholder || "Search products...");
      setElValue("setPaymentInstructions", cfg.paymentInstructions || "");
      setElValue("setChatHelperSubtitle", cfg.chatHelperSubtitle || DEFAULT_EXTRA_SETTINGS.chatHelperSubtitle);
      setElChecked("setAutoPinMode", cfg.autoPinMode);
      setElValue("setPinFieldLabel", cfg.pinFieldLabel || DEFAULT_EXTRA_SETTINGS.pinFieldLabel);
      setElValue("setOrderNotePlaceholder", cfg.orderNotePlaceholder || DEFAULT_EXTRA_SETTINGS.orderNotePlaceholder);
      setElChecked("setShowRotatingTicker", cfg.showRotatingTicker !== false);
      setElValue("setTickerIntervalSec", cfg.tickerIntervalSec);
      setElValue("setTickerMessages", cfg.tickerMessages || "");
      setElChecked("setShowAwarenessFloat", cfg.showAwarenessFloat);
      setElChecked("setAwarenessAutoSlide", cfg.awarenessAutoSlide);
      setElValue("setAwarenessImageUrl", Array.isArray(cfg.awarenessImageUrl)
        ? cfg.awarenessImageUrl.join("\n")
        : (cfg.awarenessImageUrl || ""));
      setElValue("setAwarenessCaption", Array.isArray(cfg.awarenessCaption)
        ? cfg.awarenessCaption.join("\n")

    async function apiRequest(url, options = {}) {
      const headers = new Headers(options.headers || {});
      if (state.staffToken) {
        headers.set("X-Staff-Token", state.staffToken);
      }
      let response;
      try {
        response = await fetch(url, { ...options, headers });
      } catch (_) {
        throw new Error("Network issue while reaching the server. Please check your connection and try again.");
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (response.status === 401 && state.staffToken && !url.startsWith("/api/messages")) {
          state.isLoggedIn = false;
          state.staffToken = "";
          const badge = byId("authBadge");
          if (badge) {
            badge.className = "badge bg-secondary";
            badge.textContent = "Staff Mode";
          }
          setElHidden("logoutBtn", true);
          syncLayoutChrome();
        }
        throw new Error(data.detail || data.message || `Request failed (${response.status})`);
      }
      return data;
    }

    function setButtonBusy(btn, busy, busyLabel = "Working...") {
      if (!btn) return;
      if (busy) {
        if (!btn.dataset.origHtml) btn.dataset.origHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-1"></i>${escapeHtml(busyLabel)}`;
      } else {
        btn.disabled = false;
        if (btn.dataset.origHtml) btn.innerHTML = btn.dataset.origHtml;
      }
    }

    async function runGuardedAction(lockKey, cooldownMs, submitBtn, busyLabel, fn) {
      const now = Date.now();
      const prevTime = state.lastSubmitAt.get(lockKey) || 0;
      if (state.busyKeys.has(lockKey) || (cooldownMs > 0 && now - prevTime < cooldownMs)) {
        return;
      }
      state.busyKeys.add(lockKey);
      state.lastSubmitAt.set(lockKey, now);
      setButtonBusy(submitBtn, true, busyLabel);
      try {
        await fn();
      } finally {
        state.busyKeys.delete(lockKey);
        setButtonBusy(submitBtn, false);
      }
    }

        .replace(/</g, "&lt;")

    }

    function formatWhatsAppPhone(rawPhone) {
      const digits = String(rawPhone || "").replace(/\D/g, "");
      if (!digits) return "";
      if (digits.startsWith("234") && digits.length >= 13) {
        return digits;
      }
      if (digits.startsWith("0") && digits.length === 11) {
        return "234" + digits.slice(1);
      }
      return digits;
    }

    function buildWhatsAppReceiptMessage({ title, ref, customer, phone, timestamp, lines, total }) {
      const footerText = state.extraSettings.receiptFooter || "Thank you for your patronage!";
      const rows = [
        `*${state.businessName}*`,
        `*${title || "RECEIPT"}*`,
        "------------------------------",
        `Customer: ${customer || "Customer"}`,
        phone ? `Phone: ${phone}` : "",
        ref ? `Ref: ${ref}` : "",
        timestamp ? `Date: ${timestamp}` : "",
        ...(lines || []),
        total ? `*Total: ${total}*` : "",
        "------------------------------",
        footerText,
      ].filter(Boolean);
      return rows.join("\n");
    }

    function sendReceiptToCustomerWhatsApp({ phone, receiptMessage }) {
      const cleanPhone = String(phone || "").trim();
      const waDigits = formatWhatsAppPhone(cleanPhone);
      if (!cleanPhone || cleanPhone.toUpperCase() === "N/A" || !waDigits) {
        throw new Error("Enter a valid customer WhatsApp number before sending a receipt to WhatsApp.");
      }
      const waUrl = `https://wa.me/${encodeURIComponent(waDigits)}?text=${encodeURIComponent(receiptMessage)}`;
      window.open(waUrl, "_blank", "noopener,noreferrer");
    }

      const cleanId = String(msgId || "").trim();
      if (!cleanId) return;
      state.deletedPhotoIds.add(cleanId);
      saveIdSetToStorage(DELETED_CHAT_PHOTOS_KEY, state.deletedPhotoIds);

      try {
        await apiRequest(`/api/messages/${encodeURIComponent(cleanId)}/photo`, { method: "DELETE" });
      } catch (_) {
        try {
          await apiRequest(`/api/messages/${encodeURIComponent(cleanId)}/delete-photo`, { method: "POST" });
        } catch (_) {}
      }

      await loadStaffChatMessages();
      if (state.customerAuth.unlocked) {
        await loadCustomerPrivateChat();
      }
      showBanner("Chat photo removed to save storage.", "success");

    async function deleteAllChatPhotos() {
      const photoMsgs = (state.staffMessagesFeed || []).filter(
        (m) => m.id && m.proof_url && String(m.proof_url).startsWith("http")
      );
      if (!photoMsgs.length) {
        showBanner("No active chat photos found to delete.", "info");
        return;
      }

      for (const m of photoMsgs) {
        state.deletedPhotoIds.add(String(m.id));
      }
      saveIdSetToStorage(DELETED_CHAT_PHOTOS_KEY, state.deletedPhotoIds);

      try {
        await apiRequest("/api/messages/photos", { method: "DELETE" });
      } catch (_) {
        for (const m of photoMsgs) {
          try {
            await apiRequest(`/api/messages/${encodeURIComponent(m.id)}/photo`, { method: "DELETE" });
          } catch (_) {}
        }
      }

      await loadStaffChatMessages();
      if (state.customerAuth.unlocked) {
        await loadCustomerPrivateChat();
      }
      showBanner(`Removed ${photoMsgs.length} chat photo(s) to free up storage.`, "success");
    }

      const clean = String(videoUrl ?? "").trim();

    function getYouTubeEmbedUrl(url) {
      const raw = String(url ?? "").trim();
      const watchMatch = raw.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{6,})/);
      if (watchMatch && watchMatch[1]) {
        return `https://www.youtube.com/embed/${watchMatch[1]}`;
      }
      return null;
    }

      const existingSelect = byId("existingProductSelect");
      const catSelect = byId("shopCategorySelect");
      const searchInp = byId("shopSearchInput");

      const prevCat = catSelect ? catSelect.value : "All Categories";
      const cats = ["All Categories", ...Array.from(new Set(state.products.map((p) => p.category || "General"))).sort()];
      if (catSelect) {
        catSelect.innerHTML = cats.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
        if (cats.includes(prevCat)) catSelect.value = prevCat;
      }

      const queryText = searchInp ? searchInp.value.trim().toLowerCase() : "";
      const activeCat = catSelect ? catSelect.value : "All Categories";
      const filtered = state.products.filter((p) => {
        const okCat = activeCat === "All Categories" || (p.category || "General") === activeCat;
        const okSearch =
          !queryText ||
          String(p.name || "").toLowerCase().includes(queryText) ||
          String(p.vendor_name || "").toLowerCase().includes(queryText);
        const okStock = !cfg.hideOutOfStock || Number(p.qty_cartons ?? p.stock ?? 0) > 0;
        return okCat && okSearch && okStock;
      });

      if (grid) {
        if (!filtered.length) {
          grid.innerHTML = `<div class="col-12"><div class="alert alert-secondary">No products match your selection right now.</div></div>`;
        } else {
          grid.innerHTML = filtered.map((p) => {
            const imgSrc = p.image_url || "";
            const mLbl = p.unit_main_label || "Carton";
            const pLbl = p.unit_pack_label || "Pack";
            const rLbl = p.unit_retail_label || "Retail Unit";
            const displayPrice = Number(p.price_retail ?? p.price ?? p.price_carton ?? 0);
            const stockVal = Number(p.qty_cartons ?? p.stock ?? 0);
            const hasAd = cfg.showWatchAd && hasValidVideoUrl(p.video_url);
            const vendorBadgeHtml = cfg.showVendorBadges && p.vendor_name
              ? `<div class="mb-1"><span class="badge bg-info-subtle text-info-emphasis border border-info-subtle"><i class="fa-solid fa-store me-1"></i>${escapeHtml(p.vendor_name)}</span></div>`
              : "";
            const imgHtml = imgSrc
              ? `<div class="product-img-wrap"><img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(p.name)}" loading="lazy" /></div>`
              : `<div class="product-img-wrap text-muted"><i class="fa-solid fa-box-open fa-2x"></i></div>`;

            const metaLine = cfg.showStockOnCards
              ? `Stock: ${stockVal.toFixed(2)} ${escapeHtml(mLbl)} &bull; ${escapeHtml(p.category || "General")}`
              : `${escapeHtml(p.category || "General")}`;

            return `
              <div class="col-6 col-md-4 col-lg-3">
                <div class="card h-100 shadow-sm product-card">
                  ${imgHtml}
                  <div class="card-body d-flex flex-column">
                    <h6 class="card-title fw-bold mb-1">${escapeHtml(p.name)}</h6>
                    ${vendorBadgeHtml}
                    <div class="text-primary fw-semibold mb-1">${formatMoney(displayPrice)} <span class="small text-muted">/ ${escapeHtml(rLbl)}</span></div>
                    <div class="small text-muted mb-2">${metaLine}</div>
                    <p class="small text-secondary flex-grow-1">${escapeHtml(p.description || "")}</p>
                    ${hasAd ? `
                      <button type="button" class="btn btn-outline-primary btn-sm w-100 mb-2" data-action="watch-ad" data-id="${escapeHtml(p.id)}">
                        <i class="fa-solid fa-play me-1"></i>Watch Ad
                      </button>
                    ` : ""}
                    <div class="row g-1 mb-2">
                      <div class="col-7">
                        <select class="form-select form-select-sm card-unit-sel">
                          <option value="${escapeHtml(rLbl)}">${escapeHtml(rLbl)} (${formatMoney(p.price_retail ?? displayPrice)})</option>
                          <option value="${escapeHtml(pLbl)}">${escapeHtml(pLbl)} (${formatMoney(p.price_pack ?? displayPrice)})</option>
                          <option value="${escapeHtml(mLbl)}">${escapeHtml(mLbl)} (${formatMoney(p.price_carton ?? displayPrice)})</option>
                        </select>
                      </div>
                      <div class="col-5">
                        <input type="number" min="1" value="1" class="form-control form-control-sm card-qty-inp" />
                      </div>
                    </div>
                    <button type="button" class="btn btn-primary btn-sm w-100" data-action="add-to-cart" data-id="${escapeHtml(p.id)}">
                      <i class="fa-solid fa-cart-plus me-1"></i>Add to Cart
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join("");
        }
      }

      if (!state.products.length) {
        if (tbody) tbody.innerHTML = `<tr><td colspan="13" class="text-muted">No inventory items yet.</td></tr>`;
        if (posSelect) posSelect.innerHTML = `<option value="">No products available</option>`;
        if (existingSelect) existingSelect.innerHTML = `<option value="">-- Choose saved product --</option>`;
        syncPosUnitOptions();
        renderInventoryAlerts();
        return;
      }

      if (tbody) {
        tbody.innerHTML = state.products.map((p) => {
          const pCarton = Number(p.price_carton ?? p.price ?? 0);
          const stockCartons = Number(p.qty_cartons ?? p.stock ?? 0);
          const cCarton = Number(p.cost ?? 0);
          const pPack = Number(p.price_pack ?? 0);
          const pRetail = Number(p.price_retail ?? 0);
          const packsCount = Number(p.packs_per_carton ?? 1);
          const retailCount = Number(p.units_per_pack ?? 1);
          const alertInfo = getProductAlertInfo(p);

          const stockFlag = alertInfo.isLowStock
            ? ` <span class="badge ${stockCartons <= 0 ? "bg-danger" : "bg-warning text-dark"}">Low</span>`
            : "";
          const expFlag = alertInfo.isExpired
            ? ` <span class="badge bg-danger">Expired</span>`
            : alertInfo.isExpiringSoon
              ? ` <span class="badge bg-warning text-dark">${alertInfo.daysLeft}d</span>`
              : "";

          return `
            <tr>
              <td class="fw-semibold">${escapeHtml(p.name)}</td>
              <td>${escapeHtml(p.category || "General")}</td>
              <td>${escapeHtml(p.vendor_name || "-")}</td>
              <td>${formatMoney(pCarton)}</td>
              <td>${stockCartons.toFixed(2)}${stockFlag}</td>
              <td>${formatMoney(cCarton)}</td>
              <td>${formatMoney(pPack)}</td>
              <td>${formatMoney(pRetail)}</td>
              <td>${packsCount}</td>
              <td>${retailCount}</td>
              <td>${escapeHtml(p.shelf || "-")}</td>
              <td>${escapeHtml(p.expiry || "-")}${expFlag}</td>
              <td class="text-nowrap">
                <button type="button" class="btn btn-outline-primary btn-sm me-1" data-action="edit-product-vendor" data-id="${escapeHtml(p.id)}" title="Edit product & vendor/sponsor">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button type="button" class="btn btn-outline-danger btn-sm" data-action="delete-product" data-id="${escapeHtml(p.id)}">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </td>
            </tr>
          `;
        }).join("");
      }

      if (posSelect) {
        const prevPos = posSelect.value;
        posSelect.innerHTML = state.products.map((p) => {
          const priceVal = Number(p.price_carton ?? p.price ?? 0);
          const stockVal = Number(p.qty_cartons ?? p.stock ?? 0);
          return `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)} (${formatMoney(priceVal)} &bull; Stock: ${stockVal.toFixed(2)})</option>`;
        }).join("");
        if (prevPos) posSelect.value = prevPos;
      }

      if (existingSelect) {
        const prevExisting = existingSelect.value;
        existingSelect.innerHTML = `<option value="">-- Choose saved product --</option>` + state.products.map((p) =>
          `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)} (${escapeHtml(p.category || "General")})</option>`
        ).join("");
        if (prevExisting) existingSelect.value = prevExisting;
      }

      syncPosUnitOptions();
      renderInventoryAlerts();
    }

    onEl("shopCategorySelect", "change", renderProducts);
    onEl("shopSearchInput", "input", renderProducts);

    async function loadProducts() {
      try {
        const res = await apiRequest("/api/products");
        const rawList = res.products || res.data || [];
        state.products = rawList.map(normalizeProductClient);
        renderProducts();
        if (state.isLoggedIn && state.extraSettings.showBusinessAnalytics) {
          await loadBusinessAnalytics();
        }
      } catch (err) {
        showBanner(`Could not load products: ${err.message}`, "danger");
      }
    }

    async function loadSettings() {
      const localExtra = readLocalExtraSettings();
      state.extraSettings = { ...DEFAULT_EXTRA_SETTINGS, ...localExtra };
      try {
        const res = await apiRequest("/api/settings");
        const s = res.settings || res.data || {};
        if (s.business_name) {
          state.businessName = s.business_name;
          document.title = s.business_name;
          setElText("businessTitleDisplay", s.business_name);
          setElText("sidebarBusinessName", s.business_name);
          setElValue("setBusinessName", s.business_name);
        }
        if (s.tagline) {
          setElText("businessTaglineDisplay", s.tagline);
          setElValue("setTagline", s.tagline);
        }
        if (s.currency) state.currency = s.currency;
        setElValue("setNotice", s.active_notice || "");
        setElValue("setBroadcastVideo", s.broadcast_video_url || "");

        if (s.extra_settings) {
          const parsedExtra = typeof s.extra_settings === "string"
            ? JSON.parse(s.extra_settings || "{}")
            : s.extra_settings;
          if (parsedExtra && typeof parsedExtra === "object") {
            state.extraSettings = { ...DEFAULT_EXTRA_SETTINGS, ...localExtra, ...parsedExtra };
            saveLocalExtraSettings(state.extraSettings);
          }
        }

        if (s.awareness_image_url && !state.extraSettings.awarenessImageUrl) {
          state.extraSettings.awarenessImageUrl = s.awareness_image_url;
        }

        const noticeEl = byId("customerNoticeAlert");
        if (noticeEl) {
          if (s.active_notice && s.active_notice.trim()) {
            noticeEl.textContent = s.active_notice.trim();
            noticeEl.classList.remove("d-none");
          } else {
            noticeEl.classList.add("d-none");
          }
        }

        renderBroadcastVideo(s.broadcast_video_url || "");
      } catch (_) {}

      applyExtraSettingsToUI();
      renderProducts();
      updateCartSummary();
    }

    function renderChatList(container, msgs, emptyText, { allowPhotoDelete = false } = {}) {
      if (!container) return;
      if (!msgs.length) {
        container.innerHTML = `<div class="text-muted small">${escapeHtml(emptyText)}</div>`;
        return;
      }

      container.innerHTML = msgs.map((rawMsg) => {
        const m = normalizeMessageClient(rawMsg);
        const hasPhoto = Boolean(m.proof_url && String(m.proof_url).startsWith("http"));
        const proofImg = hasPhoto
          ? `<div class="mt-1"><img src="${escapeHtml(m.proof_url)}" style="max-width:220px;" class="img-thumbnail" alt="Proof" /></div>`
          : (m.photo_cleared && rawMsg.proof_url
              ? `<div class="mt-1 small fst-italic text-muted"><i class="fa-solid fa-image-slash me-1"></i>Photo removed to free storage</div>`
              : "");
        const deletePhotoBtn = allowPhotoDelete && hasPhoto && m.id
          ? `<button type="button" class="btn btn-outline-danger btn-sm py-0 px-2 ms-1" data-action="delete-chat-photo" data-msg-id="${escapeHtml(m.id)}" title="Delete this photo"><i class="fa-solid fa-trash-can me-1"></i>Delete Photo</button>`
          : "";

        const rawText = m.message || m.text || "";
        const decodedText = decodeHtmlEntities(rawText).trim();
        const isTrustedSystemReceipt =
          m.sender === "System" &&
          decodedText.includes("OFFICIAL PURCHASE RECEIPT") &&
          decodedText.startsWith("<div ");
        const bodyHtml = isTrustedSystemReceipt ? decodedText : escapeHtml(rawText);

        return `
          <div class="border-bottom pb-2 mb-2">
            <div class="d-flex justify-content-between align-items-center small gap-2">
              <strong>${escapeHtml(m.sender || "Customer")}</strong>
              <div class="d-flex align-items-center gap-1">
                <span class="text-muted">${escapeHtml(m.customer_phone || m.phone || "")} &bull; ${escapeHtml(m.timestamp || "")}</span>
                ${deletePhotoBtn}
              </div>
            </div>
            <div>${bodyHtml}</div>
            ${proofImg}
          </div>
        `;
      }).join("");
    }

    function lockCustomerChatView() {
      state.customerAuth = { unlocked: false, phone: "", pin: "" };
      setElHidden("chatSendForm", true);
      setElHidden("lockChatBtn", true);
      setElHidden("customerCredentialNotice", true);
      const box = byId("chatMessagesBox");
      if (box) {
        box.innerHTML = `
          <div class="text-muted small py-3 text-center">
            <i class="fa-solid fa-lock fa-lg mb-2 d-block text-secondary"></i>
            Your chat history and purchase receipts are private. Enter your phone number and PIN (or Order Reference Code) above to unlock.
          </div>
        `;
      }
    }

    async function loadCustomerPrivateChat() {
      const phoneInp = byId("chatPhoneFilter");
      const pinInp = byId("chatPinFilter");
      const phone = (state.customerAuth.phone || (phoneInp ? phoneInp.value : "")).trim();
      const pin = (state.customerAuth.pin || (pinInp ? pinInp.value : "")).trim();
      const box = byId("chatMessagesBox");

      if (!phone || !pin) {
        lockCustomerChatView();
        return;
      }

      try {
        const query = `?phone=${encodeURIComponent(phone)}&pin=${encodeURIComponent(pin)}`;
        const res = await apiRequest(`/api/messages${query}`);
        const msgs = (res.messages || res.data || []).map(normalizeMessageClient);

        state.customerAuth = { unlocked: true, phone, pin };
        setElHidden("chatSendForm", false);
        setElHidden("lockChatBtn", false);

        renderChatList(box, msgs, `No messages or receipts found for ${phone}.`, { allowPhotoDelete: false });
      } catch (err) {
        lockCustomerChatView();
        if (box) {
          box.innerHTML = `
            <div class="text-danger small py-3 text-center">
              <i class="fa-solid fa-circle-exclamation fa-lg mb-2 d-block"></i>
              ${escapeHtml(err.message)}
            </div>
          `;
        }
      }
    }

    function renderStaffOrdersList() {
      const box = byId("staffOrdersBox");
      if (!box) return;
      const filterMode = state.ordersFilter || "all";

      const filteredOrders = (state.ordersFeed || []).filter((o) => {
        const hasSpecial = Array.isArray(o.special_items) && o.special_items.length > 0;
        const isVerified = String(o.status || "").toLowerCase() === "verified";
        if (filterMode === "pending") return !isVerified;
        if (filterMode === "verified") return isVerified;
        if (filterMode === "requests") return hasSpecial || String(o.order_type || "").toLowerCase().includes("request");
        return true;
      });

      if (!filteredOrders.length) {
        box.innerHTML = `<div class="text-muted small p-2">No orders or requests match this filter.</div>`;
        return;
      }

      box.innerHTML = filteredOrders.map((o) => {
        const originalIdx = state.ordersFeed.indexOf(o);
        const phoneVal = o.contact_phone || o.phone || "";
        const customerVal = o.customer || o.customer_name || "Customer";
        const hasSpecial = Array.isArray(o.special_items) && o.special_items.length > 0;
        const badgeLabel = o.order_type || (hasSpecial ? "Multi-Item Request" : "Cart Order");
        const badgeClass = hasSpecial ? "bg-info text-dark" : "bg-primary";
        const isVerified = String(o.status || "").toLowerCase() === "verified";

        let detailsHtml = "";
        if (hasSpecial) {
          detailsHtml = o.special_items
            .map((sp) => `<div class="small">${escapeHtml(sp.item || sp.name || "")}</div>`)
            .join("");
        } else if (Array.isArray(o.items) && o.items.length > 0) {
          const totalVal = o.items.reduce((sum, it) => sum + Number(it.total_price || 0), 0);
          detailsHtml = o.items
            .map((it) => `<div class="small">${escapeHtml(it.name || "Item")} (${escapeHtml(it.unit || "Unit")}) &times; ${escapeHtml(it.qty || 1)} &mdash; ${formatMoney(it.total_price || 0)}</div>`)
            .join("") + `<div class="small fw-bold mt-1">Total: ${formatMoney(totalVal)}</div>`;
        }

        const hasStructuredItems = hasSpecial || (Array.isArray(o.items) && o.items.length > 0);
        const noteHtml = o.notes
          ? `<div class="${hasStructuredItems ? "small text-secondary mt-1" : "small"}">${hasStructuredItems ? "Note: " : ""}${escapeHtml(o.notes)}</div>`
          : "";

        return `
          <div class="border rounded p-2 mb-2 bg-light order-entry" data-action="select-order-phone" data-phone="${escapeHtml(phoneVal)}">
            <div class="d-flex justify-content-between align-items-center small mb-1 gap-1">
              <strong>${escapeHtml(customerVal)} (${escapeHtml(phoneVal)})</strong>
              <div class="d-flex gap-1">
                ${isVerified ? `<span class="badge bg-success">Verified</span>` : `<span class="badge bg-warning text-dark">Pending</span>`}
                <span class="badge ${badgeClass}">${escapeHtml(badgeLabel)}</span>
              </div>
            </div>
            <div class="small text-muted mb-1">${escapeHtml(o.timestamp || "")}${o.payment_ref ? ` &bull; Ref: ${escapeHtml(o.payment_ref)}` : ""}</div>
            ${detailsHtml}
            ${noteHtml}
            <div class="mt-2 d-flex flex-wrap gap-1">
              <button type="button" class="btn btn-outline-dark btn-sm" data-action="open-order-receipt" data-order-index="${originalIdx}">
                <i class="fa-solid fa-print me-1"></i>Receipt
              </button>
              <button type="button" class="btn btn-outline-success btn-sm" data-action="send-order-receipt-whatsapp" data-order-index="${originalIdx}" data-phone="${escapeHtml(phoneVal)}">
                <i class="fa-brands fa-whatsapp me-1"></i>Send to WhatsApp
              </button>
              <button type="button" class="btn btn-success btn-sm" data-action="verify-send-receipt" data-order-id="${escapeHtml(o.id)}" data-phone="${escapeHtml(phoneVal)}">
                <i class="fa-solid fa-check-double me-1"></i>Verify &amp; Send
              </button>
              <button type="button" class="btn btn-outline-danger btn-sm" data-action="delete-order" data-order-id="${escapeHtml(o.id)}">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function loadStaffOrders() {
      const box = byId("staffOrdersBox");
      try {
        const res = await apiRequest("/api/orders");
        const rawOrders = (res.orders || res.data || []).map(normalizeOrderClient);

        const seenKeys = new Set();
        const orders = rawOrders.filter((o) => {
          const key = `${o.payment_ref || ""}|${o.timestamp || ""}|${o.contact_phone || o.phone || ""}`;
          if (o.payment_ref && seenKeys.has(key)) return false;
          seenKeys.add(key);
          return true;
        });

        state.ordersFeed = orders;
        renderStaffOrdersList();
      } catch (err) {
        if (box) box.innerHTML = `<div class="text-danger small p-2">Failed to load orders: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function loadStaffChatMessages() {
      const filterInp = byId("staffChatPhoneFilter");
      const phone = filterInp ? filterInp.value.trim() : "";
      const box = byId("staffChatMessagesBox");
      try {
        const query = phone ? `?phone=${encodeURIComponent(phone)}` : "";
        const res = await apiRequest(`/api/messages${query}`);
        const msgs = (res.messages || res.data || []).map(normalizeMessageClient);
        state.staffMessagesFeed = msgs;
        renderChatList(box, msgs, "No chat messages or receipts found.", { allowPhotoDelete: true });
      } catch (err) {
        if (box) box.innerHTML = `<div class="text-danger small">Failed to load chat: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderRecordsLists() {
      const debtorsBox = byId("debtorsListBox");
      const expensesBox = byId("expensesListBox");
      const workersBox = byId("workersListBox");

      if (debtorsBox) {
        const activeDebtors = (state.debtorsList || []).filter((d) => {
          const id = String(d.id ?? "");
          const status = String(d.status ?? "").toLowerCase();
          return !state.paidDebtorIds.has(id) && status !== "paid" && status !== "settled";
        });
        debtorsBox.innerHTML = activeDebtors.length
          ? activeDebtors
              .map((d) => {
                const id = String(d.id ?? "");
                const name = d.customer || d.name || "Customer";
                const phone = d.phone || "";
                const amount = formatMoney(d.amount || 0);
                const note = d.items_bought || d.note || "";
                return `
                  <div class="border rounded p-2 mb-1 bg-light d-flex justify-content-between align-items-center gap-2">
                    <div>
                      <div class="fw-semibold">${escapeHtml(name)} (${escapeHtml(phone)})</div>
                      <div class="text-danger fw-bold">${amount}</div>
                      ${note ? `<div class="text-muted">${escapeHtml(note)}</div>` : ""}
                    </div>
                    ${id ? `<button type="button" class="btn btn-outline-success btn-sm py-0 px-2" data-action="mark-debtor-paid" data-id="${escapeHtml(id)}">Paid</button>` : ""}
                  </div>
                `;
              })
              .join("")
          : `<div class="text-muted">No unpaid debtors recorded.</div>`;
      }

      if (expensesBox) {
        expensesBox.innerHTML = (state.expensesList || []).length
          ? state.expensesList
              .slice(0, 15)
              .map((ex) => {
                const id = String(ex.id ?? "");
                const title = ex.note || ex.category || "Expense";
                const cat = ex.category || "Operations";
                const amount = formatMoney(ex.amount || 0);
                return `
                  <div class="border rounded p-2 mb-1 bg-light d-flex justify-content-between align-items-center gap-2">
                    <div>
                      <div class="fw-semibold">${escapeHtml(title)} <span class="badge bg-secondary-subtle text-secondary-emphasis">${escapeHtml(cat)}</span></div>
                      <div class="text-danger fw-bold">${amount}</div>
                    </div>
                    ${id ? `<button type="button" class="btn btn-outline-danger btn-sm py-0 px-2" data-action="delete-expense" data-id="${escapeHtml(id)}"><i class="fa-solid fa-trash"></i></button>` : ""}
                  </div>
                `;
              })
              .join("")
          : `<div class="text-muted">No expenses logged yet.</div>`;
      }

      if (workersBox) {
        workersBox.innerHTML = (state.workersList || []).length
          ? state.workersList
              .map((w) => {
                const id = String(w.id ?? "");
                const name = w.name || w.username || "Staff";
                const role = w.role || "Staff";
                return `
                  <div class="border rounded p-2 mb-1 bg-light d-flex justify-content-between align-items-center gap-2">
                    <div>
                      <div class="fw-semibold">${escapeHtml(name)}</div>
                      <div class="text-muted">${escapeHtml(role)}</div>
                    </div>
                    ${id ? `<button type="button" class="btn btn-outline-danger btn-sm py-0 px-2" data-action="delete-worker" data-id="${escapeHtml(id)}"><i class="fa-solid fa-trash"></i></button>` : ""}
                  </div>
                `;
              })
              .join("")
          : `<div class="text-muted">No staff accounts listed yet.</div>`;
      }
    }

    async function loadRecordsData() {
      if (!state.isLoggedIn) return;
      const [debRes, expRes, wrkRes] = await Promise.all([
        apiRequest("/api/debtors").catch(() => ({})),
        apiRequest("/api/expenses").catch(() => ({})),
        apiRequest("/api/workers").catch(() => ({})),
      ]);
      state.debtorsList = Array.isArray(debRes.debtors) ? debRes.debtors : Array.isArray(debRes.data) ? debRes.data : [];
      state.expensesList = Array.isArray(expRes.expenses) ? expRes.expenses : Array.isArray(expRes.data) ? expRes.data : [];
      state.workersList = Array.isArray(wrkRes.workers) ? wrkRes.workers : Array.isArray(wrkRes.data) ? wrkRes.data : [];
      renderRecordsLists();
    }

    function openStaffPortalLogin() {
      const sidebarCol = byId("staffSidebarCol");
      const mainCol = byId("mainContentCol");
      const loginUser = byId("loginUsername");
      if (sidebarCol) sidebarCol.classList.remove("d-none");
      if (mainCol) mainCol.className = "col-lg-9 col-xl-10 p-3 p-md-4";
      if (loginUser) loginUser.focus();
      showBanner("Enter your staff or admin credentials on the left to sign in.", "info");
    }

    function switchSection(sectionId) {
      if (sectionId === "staffSection" && !state.isLoggedIn) {
        openStaffPortalLogin();
        return;
      }
      setElHidden("customerSection", sectionId !== "customerSection");
      setElHidden("staffSection", sectionId !== "staffSection");
      document.querySelectorAll(".nav-pill-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.section === sectionId);
      });
      syncLayoutChrome();
    }

    function switchCustomerTab(tabId) {
      document.querySelectorAll(".customer-tab-pane").forEach((pane) => {
        pane.classList.toggle("d-none", pane.id !== tabId);
      });
      document.querySelectorAll("#customerTabs .nav-link").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === tabId);
      });
      if (tabId === "chatTab") {
        if (state.customerAuth.unlocked) {
          loadCustomerPrivateChat();
        } else {
          lockCustomerChatView();

    function buildOrderReceiptPayload(o) {
      const hasSpecial = Array.isArray(o.special_items) && o.special_items.length > 0;
      let lines = [];
      let totalStr = "";
      if (hasSpecial) {
        lines = o.special_items.map((sp) => `${sp.item || sp.name || "Requested Item"}`);
      } else if (Array.isArray(o.items) && o.items.length > 0) {
        lines = o.items.map((it) => `${it.name || "Item"} (${it.unit || "Unit"}) x ${it.qty || 1} = ${formatMoney(it.total_price || 0)}`);
        const sum = o.items.reduce((acc, it) => acc + Number(it.total_price || 0), 0);
        totalStr = formatMoney(sum);
      } else if (o.notes) {
        lines = [o.notes];
      } else {
        lines = ["Customer Order"];
      }
      if (o.notes && hasSpecial) lines.push(`Note: ${o.notes}`);
      if (o.notes && Array.isArray(o.items) && o.items.length > 0) lines.push(`Note: ${o.notes}`);
      return {
        title: hasSpecial ? "MULTI-ITEM REQUEST RECEIPT" : "CUSTOMER ORDER RECEIPT",
        ref: o.payment_ref || "",
        customer: o.customer || o.customer_name || "Customer",
        phone: o.contact_phone || o.phone || "",
        timestamp: o.timestamp || "",
        lines,
        total: totalStr,
      };
    }

      if (!state.customerAuth.unlocked) {
        showBanner("Please unlock your private chat first.", "warning");
        return;
      }
      const btn = e.target.querySelector('button[type="submit"]');
      await runGuardedAction("customer-chat-send", 1200, btn, "Sending...", async () => {
        const phone = state.customerAuth.phone;
        const pinInp = byId("chatPinFilter");
        const textInp = byId("chatSendText");
        const proofInp = byId("chatProofFile");
        const pin = state.customerAuth.pin || (pinInp ? pinInp.value.trim() : "");
        const text = textInp ? textInp.value.trim() : "";
        const proofFile = proofInp && proofInp.files ? proofInp.files[0] : null;
        const fd = new FormData();
        fd.append("phone", phone);
        fd.append("pin", pin);
        fd.append("sender", "Customer");
        fd.append("text", text);
        if (proofFile) fd.append("proof_file", proofFile);

        try {
          await apiRequest("/api/messages", { method: "POST", body: fd });
          if (textInp) textInp.value = "";
          if (proofInp) proofInp.value = "";
          await loadCustomerPrivateChat();
        } catch (err) {
          showBanner(`Failed to send message: ${err.message}`, "danger");
        }
      });
    });

    onEl("posSaleForm", "submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      await runGuardedAction("pos-sale", 1500, btn, "Recording...", async () => {
        const prodSel = byId("posProductSelect");
        const unitSel = byId("posUnitSelect");
        const qtyInp = byId("posQty");
        const custInp = byId("posCustomerName");
        const phoneInp = byId("posPhone");
        const paySel = byId("posPaymentMethod");
        const waChk = byId("posSendReceiptToWhatsApp");

        const prodId = prodSel ? prodSel.value : "";
        const unitType = unitSel ? unitSel.value : "Carton";
        const qty = Math.max(1, Number(qtyInp ? qtyInp.value : 1) || 1);
        const prod = state.products.find((p) => String(p.id) === String(prodId));
        if (!prod) {
          showBanner("Please select a valid product.", "warning");
          return;
        }
        const unitPrice = getPriceForUnit(prod, unitType);
        const totalAmount = unitPrice * qty;
        const custName = (custInp ? custInp.value.trim() : "") || "Walk-in Customer";
        const custPhone = (phoneInp ? phoneInp.value.trim() : "") || "N/A";
        const paySource = paySel ? paySel.value : "Cash";
        const sendWhatsAppOpt = Boolean(waChk && waChk.checked);

        try {
          const res = await apiRequest("/api/sales", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              product_id: prod.id,
              item_name: prod.name,
              unit_type: unitType,
              qty,
              unit_price: unitPrice,
              total: totalAmount,
              customer_name: custName,
              customer_phone: custPhone,
              payment_source: paySource,
              worker: state.user?.username || "admin",
              record_debt: false,
            }),
          });
          const rec = res.receipt || {};
          const refCode = rec.payment_ref || "";
          const formattedTotal = formatMoney(totalAmount);

          let waStatusHtml = "";
          if (sendWhatsAppOpt && custPhone && custPhone !== "N/A") {
            try {
              const receiptMessage = buildWhatsAppReceiptMessage({
                title: "POS SALES RECEIPT",
                ref: refCode,
                customer: custName,
                phone: custPhone,
                timestamp: new Date().toLocaleString(),
                lines: [`${prod.name} (${unitType}) x ${qty}`, `Payment: ${paySource}`],
                total: formattedTotal,
              });
              sendReceiptToCustomerWhatsApp({ phone: custPhone, receiptMessage });
              waStatusHtml = `<div class="text-success mt-1"><i class="fa-brands fa-whatsapp me-1"></i>Opened WhatsApp receipt for ${escapeHtml(custPhone)}.</div>`;
            } catch (waErr) {
              waStatusHtml = `<div class="text-warning mt-1"><i class="fa-solid fa-triangle-exclamation me-1"></i>${escapeHtml(waErr.message)}</div>`;
            }
          }

          const receiptBox = byId("posReceiptBox");
          if (receiptBox) {
            receiptBox.innerHTML = `
              <div class="alert alert-success py-2 small d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                  <strong>Receipt Saved (${escapeHtml(refCode)}):</strong> ${escapeHtml(prod.name)} (${qty} ${escapeHtml(unitType)}) &mdash; <strong>${formattedTotal}</strong>
                  ${waStatusHtml}
                </div>
                <div class="d-flex gap-1">
                  <button type="button" class="btn btn-success btn-sm" data-action="send-pos-receipt-whatsapp" data-ref="${escapeHtml(refCode)}" data-item="${escapeHtml(prod.name)}" data-unit="${escapeHtml(unitType)}" data-qty="${qty}" data-total="${formattedTotal}" data-customer="${escapeHtml(custName)}" data-phone="${escapeHtml(custPhone)}" data-source="${escapeHtml(paySource)}">
                    <i class="fa-brands fa-whatsapp me-1"></i>Send to WhatsApp
                  </button>
                  <button type="button" class="btn btn-dark btn-sm" data-action="open-pos-receipt" data-ref="${escapeHtml(refCode)}" data-item="${escapeHtml(prod.name)}" data-unit="${escapeHtml(unitType)}" data-qty="${qty}" data-total="${formattedTotal}" data-customer="${escapeHtml(custName)}" data-phone="${escapeHtml(custPhone)}" data-source="${escapeHtml(paySource)}">
                    <i class="fa-solid fa-print me-1"></i>Thermal Receipt
                  </button>
                </div>
              </div>
            `;
          }
          await loadProducts();
          showBanner(`Recorded sale of ${formattedTotal} and updated stock.`, "success");
        } catch (err) {
          showBanner(`Failed to record sale: ${err.message}`, "danger");
        }
      });
    });

    onEl("settingsForm", "submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      await runGuardedAction("save-settings", 1500, btn, "Saving...", async () => {
        const currencyInp = byId("setCurrency");
        const currencyVal = (currencyInp ? currencyInp.value.trim() : "") || "\u20a6";
        state.currency = currencyVal;

        const awarenessFileInp = byId("setAwarenessImageFile");
        const awarenessUrlInp = byId("setAwarenessImageUrl");
        const awarenessFiles = awarenessFileInp ? awarenessFileInp.files : null;
        let awarenessImgVal = awarenessUrlInp ? awarenessUrlInp.value.trim() : "";
        if (awarenessFiles && awarenessFiles.length > 0) {
          try {
            const uploadedList = await readAwarenessFilesAsDataUrls(awarenessFiles);
            const existingList = parseAwarenessList(awarenessImgVal);
            const mergedList = [...existingList, ...uploadedList];
            awarenessImgVal = mergedList.join("\n");
            setElValue("setAwarenessImageUrl", awarenessImgVal);
            setElChecked("setShowAwarenessFloat", true);
          } catch (fileErr) {
            showBanner(fileErr.message, "warning");
            return;
          }
        }

        const nextExtra = {
          showBusinessAnalytics: Boolean(byId("setShowBusinessAnalytics")?.checked),
          showInventoryAlerts: Boolean(byId("setShowInventoryAlerts")?.checked),
          lowStockThreshold: Math.max(0, Number(byId("setLowStockThreshold")?.value ?? 2)),
          showTabShop: Boolean(byId("setShowTabShop")?.checked),
          showTabRequest: Boolean(byId("setShowTabRequest")?.checked),
          showTabChat: Boolean(byId("setShowTabChat")?.checked),
          showTabCart: Boolean(byId("setShowTabCart")?.checked),
          showDockCartBadge: Boolean(byId("setShowDockCartBadge")?.checked),
          showTopCartBtn: Boolean(byId("setShowTopCartBtn")?.checked),
          mobileTabLabels: (byId("setMobileTabLabels")?.value || "").trim() || DEFAULT_EXTRA_SETTINGS.mobileTabLabels,
          showWatchAd: Boolean(byId("setShowWatchAd")?.checked),
          showVendorBadges: Boolean(byId("setShowVendorBadges")?.checked),
          showStockOnCards: Boolean(byId("setShowStockOnCards")?.checked),
          hideOutOfStock: Boolean(byId("setHideOutOfStock")?.checked),
          searchPlaceholder: (byId("setSearchPlaceholder")?.value || "").trim() || "Search products...",
          paymentInstructions: (byId("setPaymentInstructions")?.value || "").trim(),
          chatHelperSubtitle: (byId("setChatHelperSubtitle")?.value || "").trim() || DEFAULT_EXTRA_SETTINGS.chatHelperSubtitle,
          autoPinMode: Boolean(byId("setAutoPinMode")?.checked),
          pinFieldLabel: (byId("setPinFieldLabel")?.value || "").trim() || DEFAULT_EXTRA_SETTINGS.pinFieldLabel,
          orderNotePlaceholder: (byId("setOrderNotePlaceholder")?.value || "").trim() || DEFAULT_EXTRA_SETTINGS.orderNotePlaceholder,
          footerText: (byId("setFooterText")?.value || "").trim(),
          receiptFooter: (byId("setReceiptFooter")?.value || "").trim() || "Thank you for your patronage!",
          showRotatingTicker: byId("setShowRotatingTicker") ? Boolean(byId("setShowRotatingTicker").checked) : true,
          tickerIntervalSec: normalizeTickerIntervalSec(byId("setTickerIntervalSec")?.value),
          tickerMessages: (byId("setTickerMessages")?.value || "").trim(),
          showAwarenessFloat: Boolean(byId("setShowAwarenessFloat")?.checked),
          awarenessAutoSlide: Boolean(byId("setAwarenessAutoSlide")?.checked),
          awarenessImageUrl: awarenessImgVal,
          awarenessCaption: (byId("setAwarenessCaption")?.value || "").trim(),
        };

        state.awarenessDismissed = false;
        _awarenessSlideIndex = 0;
        resetAwarenessPosition();
        state.extraSettings = nextExtra;
        saveLocalExtraSettings(nextExtra);

        const fd = new FormData(e.target);
        fd.append("currency", currencyVal);
        fd.append("extra_settings", JSON.stringify(nextExtra));

        try {
          await apiRequest("/api/settings", { method: "POST", body: fd });
          setElValue("setBroadcastVideoFile", "");
          setElValue("setAwarenessImageFile", "");
          await loadSettings();
          showBanner("All app settings saved and applied!", "success");
        } catch (err) {
          applyExtraSettingsToUI();
          renderProducts();
          updateCartSummary();
          showBanner(`Failed to save settings to server: ${err.message}`, "danger");
        }
      });
    });

    (async function initApp() {
      state.deletedPhotoIds = readIdSetFromStorage(DELETED_CHAT_PHOTOS_KEY);
      state.paidDebtorIds = readIdSetFromStorage(PAID_DEBTOR_IDS_KEY);
      state.vendorOverrides = readVendorOverrides();

      const awarenessCard = byId("customerAwarenessFloat");
      if (awarenessCard) {
        awarenessCard.addEventListener("pointerdown", (ev) => {
          if (ev.target.closest("button")) return;
          _awarenessDragActive = true;
          _awarenessDragMoved = false;
          _awarenessPointerStartX = ev.clientX;
          _awarenessPointerStartY = ev.clientY;
          _awarenessBaseOffsetX = _awarenessOffsetX;
          _awarenessBaseOffsetY = _awarenessOffsetY;
          awarenessCard.classList.add("is-dragging");
          try { awarenessCard.setPointerCapture(ev.pointerId); } catch (_) {}
        });

        awarenessCard.addEventListener("pointermove", (ev) => {
          if (!_awarenessDragActive) return;
          const dx = ev.clientX - _awarenessPointerStartX;
          const dy = ev.clientY - _awarenessPointerStartY;
          if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
            _awarenessDragMoved = true;
          }
          if (_awarenessDragMoved) {
            const rect = awarenessCard.getBoundingClientRect();
            const baseLeft = rect.left - _awarenessBaseOffsetX;
            const baseTop = rect.top - _awarenessBaseOffsetY;
            const minX = 8 - baseLeft;
            const maxX = (window.innerWidth - rect.width - 8) - baseLeft;
            const minY = 8 - baseTop;
            const maxY = (window.innerHeight - rect.height - 8) - baseTop;
            _awarenessOffsetX = Math.min(Math.max(_awarenessBaseOffsetX + dx, minX), maxX);
            _awarenessOffsetY = Math.min(Math.max(_awarenessBaseOffsetY + dy, minY), maxY);
            applyAwarenessPosition();
          }
        });

        const finishAwarenessPointer = (ev) => {
          if (!_awarenessDragActive) return;
          _awarenessDragActive = false;
          awarenessCard.classList.remove("is-dragging");
          try { awarenessCard.releasePointerCapture(ev.pointerId); } catch (_) {}

          const dx = ev.clientX - _awarenessPointerStartX;
          const dy = ev.clientY - _awarenessPointerStartY;
          const clickedImg = Boolean(ev.target.closest("#customerAwarenessImg"));
          if (clickedImg && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) {
            _awarenessOffsetX = _awarenessBaseOffsetX;
            _awarenessOffsetY = _awarenessBaseOffsetY;
            applyAwarenessPosition();
            stepAwarenessSlide(dx < 0 ? 1 : -1);
          }
        };

        awarenessCard.addEventListener("pointerup", finishAwarenessPointer);
        awarenessCard.addEventListener("pointercancel", finishAwarenessPointer);
      }

      syncLayoutChrome();
      lockCustomerChatView();
      updateCartSummary();
      await loadSettings();
      await loadProducts();
    })();
  </script>
