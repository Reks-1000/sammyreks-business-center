<script>
    // ========================================================================
    // 1. GLOBAL STATE & THEME CONFIGURATION
    // ========================================================================
    const COLOR_THEMES = [
      {
        name: "Default Deep Navy",
        body: "#060b14",
        surface: "#0d1626",
        surface2: "#132036",
        input: "#0a1220",
        header: "#08101e",
        border: "#1e2e4a",
        gold: "#f59e0b"
      },
      {
        name: "Midnight Emerald",
        body: "#05110e",
        surface: "#0b1f1a",
        surface2: "#112c25",
        input: "#081814",
        header: "#071612",
        border: "#1a3f35",
        gold: "#10b981"
      },
      {
        name: "Royal Indigo",
        body: "#090717",
        surface: "#13102b",
        surface2: "#1b173d",
        input: "#0e0c21",
        header: "#0b091c",
        border: "#2a2459",
        gold: "#a78bfa"
      },
      {
        name: "Obsidian Crimson",
        body: "#12070b",
        surface: "#210e15",
        surface2: "#2e141e",
        input: "#190a10",
        header: "#16090e",
        border: "#471e2d",
        gold: "#fb7185"
      }
    ];

    const state = {
      settings: {
        business_name: "Sammyreks Business Center",
        tagline: "",
        currency: "₦",
        active_notice: "",
        broadcast_video_url: "",
        awareness_image_url: "",
        extra_settings: {}
      },
      shops: [],
      selectedShopId: "main",
      products: [],
      cart: [],
      orders: [],
      orderFilter: "All",
      sales: [],
      debtors: [],
      expenses: [],
      workers: [],
      staffMessages: [],
      stagedBatchItems: [],
      pendingPhotoClearConfirm: false,
      pendingSlideClearConfirm: false,
      tips: [
        "Tip: Use your Phone Number & 4-digit PIN (or Order Ref) in Chat & Receipts to track orders.",
        "Tip: Click 'Watch Ad' on any item card to view product photos or video demos.",
        "Tip: Need an item not listed? Use 'Request Custom Items' to send a direct request."
      ],
      tipIndex: 0,
      customerChat: {
        phone: "",
        pin: "",
        unlocked: false,
        messages: []
      },
      staff: {
        token: sessionStorage.getItem("srk_staff_token") || "",
        username: sessionStorage.getItem("srk_staff_user") || "",
        role: sessionStorage.getItem("srk_staff_role") || "",
        shop_id: sessionStorage.getItem("srk_staff_shop") || "main"
      },
      staffShopId: sessionStorage.getItem("srk_staff_shop") || "main",
      colorCycle: {
        active: false,
        index: 0,
        timer: null
      }
    };

    const modals = {};
    let activeObjectUrls = [];
    let tipTimerHandle = null;
    let slideTimerHandle = null;
    let liveChatPollTimer = null;
    let awarenessSlidesList = [];
    let awarenessSlideIdx = 0;
    let pendingAwarenessSlideFiles = [];
    let activeAdvertProductId = null;

    // ========================================================================
    // 2. CORE UTILITIES, SANITIZERS & FORMATTERS
    // ========================================================================
    function trackObjectUrl(file) {
      if (!file) return "";
      const url = URL.createObjectURL(file);
      activeObjectUrls.push(url);
      return url;
    }

    function revokeObjectUrl(url) {
      if (!url || !url.startsWith("blob:")) return;
      try {
        URL.revokeObjectURL(url);
      } catch {
        // Ignore already revoked URLs
      }
      activeObjectUrls = activeObjectUrls.filter(u => u !== url);
    }

    function getModal(id) {
      if (!modals[id]) {
        const el = document.getElementById(id);
        if (el && window.bootstrap && typeof window.bootstrap.Modal === "function") {
          modals[id] = new window.bootstrap.Modal(el);
        }
      }
      return modals[id] || null;
    }

    function escapeHtml(val) {
      return String(val ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeJsAttr(val) {
      return escapeHtml(String(val ?? "").replace(/\\/g, "\\\\"));
    }

    function sanitizeReceiptHtml(html) {
      const template = document.createElement("template");
      template.innerHTML = String(html ?? "");
      template.content.querySelectorAll("script, iframe, object, embed, link, meta").forEach(el => el.remove());
      template.content.querySelectorAll("*").forEach(el => {
        Array.from(el.attributes).forEach(attr => {
          const name = attr.name.toLowerCase();
          const val = attr.value.trim().toLowerCase();
          if (name.startsWith("on") || ((name === "href" || name === "src") && val.startsWith("javascript:"))) {
            el.removeAttribute(attr.name);
          }
        });
      });
      return template.innerHTML;
    }

    function isSafeMediaUrl(url) {
      const s = String(url || "").trim();
      if (!s) return false;
      if (s.startsWith("/") || s.startsWith("blob:")) return true;
      return /^https?:\/\//i.test(s);
    }

    function stripMarketLabel(text) {
      return String(text || "")
        .replace(/\bwatt\s*market\b[,\s-]*/gi, "")
        .replace(/^[,\s•-]+|[,\s•-]+$/g, "")
        .trim();
    }

    function formatMoney(amount) {
      const curr = state.settings.currency || "₦";
      const num = Number(amount || 0);
      const safeNum = Number.isFinite(num) ? num : 0;
      return `${curr}${safeNum.toLocaleString("en-NG", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    function formatNowTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function normalizePhoneDigits(val) {
      return String(val || "").replace(/\D+/g, "");
    }

    function parsePipeOrLineList(raw) {
      if (!raw) return [];
      return String(raw)
        .split(/\r?\n|\|/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    async function safeJson(res) {
      try {
        return await res.json();
      } catch {
        return {};
      }
    }

    // ========================================================================
    // 3. AUTH & STATE HELPERS
    // ========================================================================
    function isStaffLoggedIn() {
      return Boolean(state.staff && state.staff.token);
    }

    function isSuperAdmin() {
      return String(state.staff.role || "").trim().toUpperCase() === "CEO";
    }

    function getActivePartnerShop() {
      if (!state.selectedShopId || state.selectedShopId === "main") return null;
      return state.shops.find(s => s.slug === state.selectedShopId) || null;
    }

    function getStaffHeaders(extra = {}) {
      const headers = { ...extra };
      if (state.staff.token) headers["X-Staff-Token"] = state.staff.token;
      return headers;
    }

    function handleStaffUnauthorized(res) {
      if (res && res.status === 401) {
        logoutStaff();
        return true;
      }
      return false;
    }

    function getExtraSettings() {
      const s = state.settings || {};
      return (typeof s.extra_settings === "object" && s.extra_settings) ? s.extra_settings : {};
    }

    // ========================================================================
    // 4. WHATSAPP CHAT BUBBLES, LIGHTBOX & LIVE POLLING
    // ========================================================================
    function syncChatScroll(box, forceScroll = false) {
      if (!box) return;
      const distanceFromBottom = box.scrollHeight - box.scrollTop - box.clientHeight;
      if (forceScroll || distanceFromBottom <= 80) {
        box.scrollTop = box.scrollHeight;
      }
    }

    function appendImmediateBubble(boxId, msg, perspective, canDeletePhoto = false) {
      const box = document.getElementById(boxId);
      if (!box) return;
      const placeholder = box.querySelector("[data-empty-chat='1']");
      if (placeholder) placeholder.remove();

      box.insertAdjacentHTML("beforeend", renderWhatsAppBubble(msg, perspective, canDeletePhoto));
      box.scrollTop = box.scrollHeight;
    }

    function openChatImageLightbox(url, caption = "Attachment Preview") {
      if (!url || !isSafeMediaUrl(url)) return;
      const img = document.getElementById("lightboxFullImage");
      const title = document.getElementById("lightboxCaptionTitle");
      const orig = document.getElementById("lightboxOriginalLink");
      if (img) img.src = url;
      if (title) title.textContent = caption;
      if (orig) orig.href = url;
      getModal("chatImageLightboxModal")?.show();
    }

    function renderWhatsAppBubble(msg, perspective = "customer", canDeletePhoto = false) {
      const sender = String(msg.sender || "Customer");
      const rawBody = String(msg.message ?? msg.text ?? "");
      const isOfficialReceiptCard = sender.toLowerCase() === "system" && rawBody.includes("OFFICIAL PURCHASE RECEIPT");
      const isSystem = sender.toLowerCase() === "system";
      const isStaff = sender.toLowerCase() === "staff";

      let bubbleClass = "wa-bubble-incoming";
      if (isSystem) {
        bubbleClass = "wa-bubble-system";
      } else if (perspective === "customer") {
        bubbleClass = isStaff ? "wa-bubble-incoming" : "wa-bubble-outgoing";
      } else {
        bubbleClass = isStaff ? "wa-bubble-outgoing" : "wa-bubble-incoming";
      }

      const contentHtml = isOfficialReceiptCard ? sanitizeReceiptHtml(rawBody) : escapeHtml(rawBody);
      const hasSafeProof = Boolean(msg.proof_url) && isSafeMediaUrl(msg.proof_url);
      const safeUrl = hasSafeProof ? escapeJsAttr(msg.proof_url) : "";
      const safeCaption = escapeJsAttr(`${sender}${msg.customer_phone ? ` (${msg.customer_phone})` : ""} • ${msg.timestamp || "Attachment"}`);

      let attachmentHtml = "";
      if (hasSafeProof) {
        const removeBtnHtml = canDeletePhoto && msg.id && !String(msg.id).startsWith("opt_")
          ? `<button type="button" class="btn btn-sm btn-outline-danger py-0 px-2" style="font-size:0.68rem;" onclick="event.stopPropagation();deleteSingleChatPhoto('${escapeJsAttr(msg.id)}')">Remove Photo</button>`
          : "";

        attachmentHtml = `
          <div class="wa-photo-card">
            <img
              src="${escapeHtml(msg.proof_url)}"
              alt="Chat attachment"
              class="wa-photo-thumb"
              onclick="openChatImageLightbox('${safeUrl}', '${safeCaption}')"
            />
            <div class="wa-photo-footer">
              <span style="cursor:pointer;color:#7dd3fc;" onclick="openChatImageLightbox('${safeUrl}', '${safeCaption}')">🔍 View full size in chat</span>
              ${removeBtnHtml}
            </div>
          </div>
        `;
      }

      const phoneTag = perspective === "staff" && msg.customer_phone
        ? ` • ${escapeHtml(msg.customer_phone)}`
        : "";

      return `
        <div class="wa-bubble ${bubbleClass}">
          <div class="wa-meta">
            <strong>${escapeHtml(sender)}${phoneTag}</strong>
            <span>${escapeHtml(msg.timestamp || "")}</span>
          </div>
          ${contentHtml ? `<div>${contentHtml}</div>` : ""}
          ${attachmentHtml}
        </div>
      `;
    }

    function onCustomerAttachmentSelected() {
      const file = document.getElementById("custMsgProofFile")?.files?.[0];
      const bar = document.getElementById("custAttachPreviewBar");
      const nameEl = document.getElementById("custAttachFileName");
      if (file && bar && nameEl) {
        nameEl.textContent = `🖼 ${file.name}`;
        bar.classList.remove("d-none");
      } else if (bar) {
        bar.classList.add("d-none");
      }
    }

    function clearCustomerAttachment() {
      const inp = document.getElementById("custMsgProofFile");
      const bar = document.getElementById("custAttachPreviewBar");
      if (inp) inp.value = "";
      if (bar) bar.classList.add("d-none");
    }

    function onStaffAttachmentSelected() {
      const file = document.getElementById("staffReplyProofFile")?.files?.[0];
      const bar = document.getElementById("staffAttachPreviewBar");
      const nameEl = document.getElementById("staffAttachFileName");
      if (file && bar && nameEl) {
        nameEl.textContent = `🖼 ${file.name}`;
        bar.classList.remove("d-none");
      } else if (bar) {
        bar.classList.add("d-none");
      }
    }

    function clearStaffAttachment() {
      const inp = document.getElementById("staffReplyProofFile");
      const bar = document.getElementById("staffAttachPreviewBar");
      if (inp) inp.value = "";
      if (bar) bar.classList.add("d-none");
    }

    function applyStaffQuickReply(text) {
      const inp = document.getElementById("staffReplyText");
      if (inp) {
        inp.value = text;
        inp.focus();
      }
    }

    function startLiveChatPolling() {
      if (liveChatPollTimer) return;
      liveChatPollTimer = setInterval(async () => {
        const custModalEl = document.getElementById("customerChatModal");
        const custModalOpen = Boolean(custModalEl && custModalEl.classList.contains("show"));
        if (custModalOpen && state.customerChat.unlocked && state.customerChat.phone && state.customerChat.pin) {
          await fetchCustomerChatMessages(state.customerChat.phone, state.customerChat.pin, true);
        }

        const staffTabEl = document.getElementById("staffOrdersChatTab");
        const staffTabActive = Boolean(staffTabEl && staffTabEl.classList.contains("show") && isStaffLoggedIn());
        if (staffTabActive) {
          await loadStaffMessages(encodeURIComponent(state.staffShopId || "main"), true);
        }
      }, 3000);
    }

    // ========================================================================
    // 5. THEME CYCLER, TIPS & AWARENESS SLIDESHOW
    // ========================================================================
    function applyColorTheme(themeObj) {
      if (!themeObj) return;
      const root = document.documentElement.style;
      root.setProperty("--bg-body", themeObj.body);
      root.setProperty("--bg-surface", themeObj.surface);
      root.setProperty("--bg-surface-2", themeObj.surface2);
      root.setProperty("--bg-input", themeObj.input);
      root.setProperty("--bg-header", themeObj.header);
      root.setProperty("--border-subtle", themeObj.border);
      root.setProperty("--gold", themeObj.gold);
    }

    function setAutoColorEnabled(enabled) {
      const wantOn = Boolean(enabled);
      if (!wantOn) {
        state.colorCycle.active = false;
        state.colorCycle.index = 0;
        if (state.colorCycle.timer) {
          clearInterval(state.colorCycle.timer);
          state.colorCycle.timer = null;
        }
        applyColorTheme(COLOR_THEMES[0]);
        return;
      }

      if (state.colorCycle.active && state.colorCycle.timer) return;
      state.colorCycle.active = true;
      state.colorCycle.index = 1;
      applyColorTheme(COLOR_THEMES[state.colorCycle.index]);

      state.colorCycle.timer = setInterval(() => {
        if (!state.colorCycle.active) return;
        state.colorCycle.index = (state.colorCycle.index + 1) % COLOR_THEMES.length;
        applyColorTheme(COLOR_THEMES[state.colorCycle.index]);
      }, 10000);
    }

    function previewAdminAutoColorToggle() {
      setAutoColorEnabled(Boolean(document.getElementById("togAutoColorCycle")?.checked));
    }

    function restartTipRotation(seconds) {
      if (tipTimerHandle) clearInterval(tipTimerHandle);
      const ms = Math.max(2000, (parseInt(seconds, 10) || 10) * 1000);
      tipTimerHandle = setInterval(() => cycleTip(1), ms);
    }

    function updateTipDisplay() {
      const el = document.getElementById("rotatingTipText");
      if (el && state.tips.length) {
        el.textContent = state.tips[state.tipIndex % state.tips.length];
      }
    }

    function cycleTip(delta) {
      if (!state.tips.length) return;
      state.tipIndex = (state.tipIndex + delta + state.tips.length) % state.tips.length;
      updateTipDisplay();
    }

    function getSlideIntervalMs() {
      const extra = getExtraSettings();
      const secs = parseInt(
        document.getElementById("setSlideSeconds")?.value ?? extra.secondsPerSlide ?? 10,
        10
      );
      const clamped = Number.isFinite(secs) ? Math.min(120, Math.max(2, secs)) : 10;
      return clamped * 1000;
    }

    function appendSlideEntry(url, descText = "") {
      const cleanUrl = String(url || "").trim();
      if (!cleanUrl) return;

      const slidesArea = document.getElementById("setAwarenessSlides");
      const descsArea = document.getElementById("setAwarenessDescriptions");

      const existingUrls = parsePipeOrLineList(slidesArea?.value || "");
      if (!existingUrls.includes(cleanUrl)) {
        existingUrls.push(cleanUrl);
        if (slidesArea) slidesArea.value = existingUrls.join("\n");
      }

      if (descsArea) {
        const existingDescs = parsePipeOrLineList(descsArea.value || "");
        while (existingDescs.length < existingUrls.length - 1) {
          existingDescs.push(`Slide ${existingDescs.length + 1}`);
        }
        if (existingDescs.length < existingUrls.length) {
          existingDescs.push(descText || `Slide ${existingUrls.length}`);
        }
        descsArea.value = existingDescs.join("\n");
      }
    }

    async function handleAwarenessSlidesUpload(inputEl) {
      const statusEl = document.getElementById("awarenessUploadStatus");
      const files = Array.from(inputEl?.files || []);
      if (!files.length) return;

      pendingAwarenessSlideFiles = files;
      if (statusEl) {
        statusEl.className = "small text-warning mt-1";
        statusEl.textContent = `Uploading ${files.length} slide image(s)...`;
      }

      const uploadedUrls = [];
      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const fd = new FormData();
          fd.append("awareness_image_file", file);
          fd.append("file", file);

          let res = await fetch("/api/upload-slide", {
            method: "POST",
            headers: getStaffHeaders(),
            body: fd
          });

          if (res.status === 404) {
            res = await fetch("/api/settings", {
              method: "POST",
              headers: getStaffHeaders(),
              body: fd
            });
          }

          if (handleStaffUnauthorized(res)) return;
          const data = await safeJson(res);
          const returnedUrl =
            data.url ||
            data.image_url ||
            data.awareness_image_url ||
            data.settings?.awareness_image_url ||
            "";

          if (!res.ok || !returnedUrl) {
            throw new Error(data.detail || `Failed to upload ${file.name}`);
          }

          const cleanBaseName = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]+/g, " ");
          appendSlideEntry(returnedUrl, cleanBaseName);
          uploadedUrls.push(returnedUrl);
        }

        pendingAwarenessSlideFiles = [];
        inputEl.value = "";

        const slidesRaw = document.getElementById("setAwarenessSlides")?.value || "";
        const descsRaw = document.getElementById("setAwarenessDescriptions")?.value || "";
        const bottomCaption = (document.getElementById("setAwarenessBottomCaption")?.value || "").trim();
        const urls = parsePipeOrLineList(slidesRaw);
        const descs = parsePipeOrLineList(descsRaw);
        awarenessSlidesList = urls.map((url, idx) => ({
          url,
          description: descs[idx] || bottomCaption || `Slide ${idx + 1}`
        }));
        awarenessSlideIdx = Math.max(0, awarenessSlidesList.length - uploadedUrls.length);
        startAwarenessSlideshow(Boolean(document.getElementById("togAutoSlidePhotos")?.checked));
        renderAwarenessSlidesManager();
        toggleAwarenessCard(true);

        if (statusEl) {
          statusEl.className = "small text-success mt-1";
          statusEl.textContent = `Added ${uploadedUrls.length} slide(s). Click "Save All App Settings" to persist.`;
        }
      } catch (err) {
        if (statusEl) {
          statusEl.className = "small text-danger mt-1";
          statusEl.textContent = `${err.message} (Will also attach on Save)`;
        }
      }
    }

    function getCurrentEditorSlides() {
      const urls = parsePipeOrLineList(document.getElementById("setAwarenessSlides")?.value || "");
      const descs = parsePipeOrLineList(document.getElementById("setAwarenessDescriptions")?.value || "");
      const bottomCaption = (document.getElementById("setAwarenessBottomCaption")?.value || "").trim();

      return urls.map((url, idx) => ({
        url,
        description: descs[idx] || bottomCaption || `Slide ${idx + 1}`
      }));
    }

    function syncEditorSlidesToFields(slides) {
      const slidesArea = document.getElementById("setAwarenessSlides");
      const descsArea = document.getElementById("setAwarenessDescriptions");
      if (slidesArea) slidesArea.value = slides.map(s => s.url).join("\n");
      if (descsArea) descsArea.value = slides.map(s => s.description).join("\n");

      awarenessSlidesList = slides;
      if (awarenessSlideIdx >= awarenessSlidesList.length) {
        awarenessSlideIdx = Math.max(0, awarenessSlidesList.length - 1);
      }
      startAwarenessSlideshow(Boolean(document.getElementById("togAutoSlidePhotos")?.checked));
      renderAwarenessSlidesManager();
    }

    function renderAwarenessSlidesManager() {
      const container = document.getElementById("awarenessSlidesManagerList");
      if (!container) return;

      const slides = getCurrentEditorSlides();
      if (!slides.length) {
        container.innerHTML = `<div class="small text-secondary py-2 px-2 rounded" style="background:#0b1220;">No slides added yet. Upload images or paste links above.</div>`;
        return;
      }

      container.innerHTML = slides.map((slide, idx) => {
        const safeUrl = isSafeMediaUrl(slide.url) ? escapeHtml(slide.url) : "";
        const thumb = safeUrl
          ? `<img src="${safeUrl}" alt="Slide ${idx + 1}" class="rounded border border-secondary-subtle" style="width:54px;height:54px;object-fit:contain;background:#080f1c;flex-shrink:0;" />`
          : `<div class="rounded border border-secondary-subtle d-flex align-items-center justify-content-center text-secondary" style="width:54px;height:54px;font-size:0.7rem;flex-shrink:0;">No Img</div>`;

        return `
          <div class="d-flex align-items-center gap-2 p-2 rounded" style="background:#0b1220;border:1px solid var(--border-subtle);">
            <span class="badge text-bg-warning text-dark">#${idx + 1}</span>
            ${thumb}
            <div class="flex-grow-1 min-w-0">
              <input
                type="text"
                class="form-control form-control-sm dark-input mb-1"
                value="${escapeHtml(slide.description)}"
                placeholder="Description for slide #${idx + 1}"
                oninput="updateSingleSlideDescription(${idx}, this.value)"
              />
              <div class="text-secondary text-truncate" style="font-size:0.7rem;">${escapeHtml(slide.url)}</div>
            </div>
            <div class="d-flex flex-column gap-1 flex-shrink-0">
              <button type="button" class="btn btn-sm btn-outline-secondary text-light py-0 px-2" ${idx === 0 ? "disabled" : ""} onclick="moveAwarenessSlide(${idx}, -1)" title="Move up">↑</button>
              <button type="button" class="btn btn-sm btn-outline-secondary text-light py-0 px-2" ${idx === slides.length - 1 ? "disabled" : ""} onclick="moveAwarenessSlide(${idx}, 1)" title="Move down">↓</button>
            </div>
            <button type="button" class="btn btn-sm btn-outline-danger py-1 px-2 flex-shrink-0" onclick="removeAwarenessSlide(${idx})" title="Remove this slide">
              Remove
            </button>
          </div>
        `;
      }).join("");
    }

    function updateSingleSlideDescription(index, newText) {
      const slides = getCurrentEditorSlides();
      if (!slides[index]) return;
      slides[index].description = newText;

      const descsArea = document.getElementById("setAwarenessDescriptions");
      if (descsArea) descsArea.value = slides.map(s => s.description).join("\n");

      awarenessSlidesList = slides;
      renderCurrentAwarenessSlide();
    }

    function moveAwarenessSlide(index, delta) {
      const slides = getCurrentEditorSlides();
      const target = index + delta;
      if (target < 0 || target >= slides.length) return;
      [slides[index], slides[target]] = [slides[target], slides[index]];
      syncEditorSlidesToFields(slides);
    }

    function removeAwarenessSlide(index) {
      const slides = getCurrentEditorSlides();
      const removed = slides.splice(index, 1)[0];
      syncEditorSlidesToFields(slides);

      if (removed && removed.url && removed.url.startsWith("/static/uploads/")) {
        fetch(`/api/upload-slide?url=${encodeURIComponent(removed.url)}`, {
          method: "DELETE",
          headers: getStaffHeaders()
        }).catch(() => {});
      }

      const fb = document.getElementById("settingsFeedbackText");
      if (fb) {
        fb.className = "small text-warning";
        fb.textContent = "Slide removed — click Save All App Settings to make permanent.";
      }
    }

    function clearAllAwarenessSlides() {
      const fb = document.getElementById("settingsFeedbackText");
      if (!state.pendingSlideClearConfirm) {
        state.pendingSlideClearConfirm = true;
        if (fb) {
          fb.className = "small text-warning fw-semibold";
          fb.textContent = "Click 'Clear All Slides' again within 5 seconds to confirm clearing all slides.";
        }
        setTimeout(() => { state.pendingSlideClearConfirm = false; }, 5000);
        return;
      }
      state.pendingSlideClearConfirm = false;
      syncEditorSlidesToFields([]);
      if (fb) {
        fb.className = "small text-warning";
        fb.textContent = "All slides cleared — click Save All App Settings to save.";
      }
    }

    function renderCurrentAwarenessSlide() {
      const imgEl = document.getElementById("awarenessCardImg");
      const bodyEl = document.getElementById("awarenessCardBody");
      const footerEl = document.getElementById("awarenessCardFooterCaption");
      const counterEl = document.getElementById("awarenessSlideCounter");
      const prevBtn = document.getElementById("awarenessPrevBtn");
      const nextBtn = document.getElementById("awarenessNextBtn");
      if (!imgEl || !bodyEl) return;

      const extra = getExtraSettings();
      const bottomCaption = String(extra.awarenessBottomCaption || "").trim();
      const hasMultiple = awarenessSlidesList.length > 1;

      if (prevBtn) prevBtn.classList.toggle("d-none", !hasMultiple);
      if (nextBtn) nextBtn.classList.toggle("d-none", !hasMultiple);

      if (awarenessSlidesList.length) {
        const idx = ((awarenessSlideIdx % awarenessSlidesList.length) + awarenessSlidesList.length) % awarenessSlidesList.length;
        awarenessSlideIdx = idx;
        const slide = awarenessSlidesList[idx];

        if (counterEl) {
          counterEl.textContent = `${idx + 1} / ${awarenessSlidesList.length}`;
        }

        if (isSafeMediaUrl(slide.url)) {
          imgEl.src = slide.url;
          imgEl.alt = slide.description || `Slide ${idx + 1}`;
          imgEl.style.display = "block";
        } else {
          imgEl.removeAttribute("src");
          imgEl.style.display = "none";
        }

        bodyEl.textContent = slide.description || bottomCaption || `Slide ${idx + 1}`;
        if (footerEl) {
          if (bottomCaption && slide.description && slide.description !== bottomCaption) {
            footerEl.textContent = bottomCaption;
            footerEl.classList.remove("d-none");
          } else {
            footerEl.textContent = "";
            footerEl.classList.add("d-none");
          }
        }
      } else {
        if (counterEl) counterEl.textContent = "";
        imgEl.removeAttribute("src");
        imgEl.style.display = "none";
        bodyEl.textContent = bottomCaption;
        if (footerEl) footerEl.classList.add("d-none");
      }
    }

    function startAwarenessSlideshow(autoSlide) {
      if (slideTimerHandle) {
        clearInterval(slideTimerHandle);
        slideTimerHandle = null;
      }

      renderCurrentAwarenessSlide();

      if (autoSlide && awarenessSlidesList.length > 1) {
        slideTimerHandle = setInterval(() => {
          awarenessSlideIdx = (awarenessSlideIdx + 1) % awarenessSlidesList.length;
          renderCurrentAwarenessSlide();
        }, getSlideIntervalMs());
      }
    }

    function stepAwarenessSlide(delta) {
      if (!awarenessSlidesList.length) return;
      awarenessSlideIdx = (awarenessSlideIdx + delta + awarenessSlidesList.length) % awarenessSlidesList.length;
      renderCurrentAwarenessSlide();
      startAwarenessSlideshow(Boolean(document.getElementById("togAutoSlidePhotos")?.checked));
    }

    function openCurrentAwarenessInLightbox() {
      if (!awarenessSlidesList.length) return;
      const slide = awarenessSlidesList[awarenessSlideIdx % awarenessSlidesList.length];
      if (slide && slide.url && isSafeMediaUrl(slide.url)) {
        openChatImageLightbox(slide.url, slide.description || `Slide ${awarenessSlideIdx + 1}`);
      }
    }

    function toggleAwarenessCard(forceState) {
      const card = document.getElementById("awarenessFloatCard");
      if (!card) return;
      const shouldShow = typeof forceState === "boolean" ? forceState : card.style.display !== "block";
      card.style.display = shouldShow ? "block" : "none";
      if (shouldShow) renderCurrentAwarenessSlide();
    }

    function toggleBroadcastBody() {
      const body = document.getElementById("broadcastVideoBody");
      const btn = document.getElementById("toggleBroadcastBtn");
      if (!body || !btn) return;
      const hidden = body.classList.toggle("d-none");
      btn.textContent = hidden ? "Show" : "Hide";
    }

    async function loadSettings() {
      try {
        const res = await fetch("/api/settings");
        const data = await safeJson(res);
        if (res.ok && data.settings) {
          state.settings = { ...state.settings, ...data.settings };
          applySettingsToUI();

    function applySettingsToUI() {
      const s = state.settings || {};
      const extra = getExtraSettings();
      const partner = getActivePartnerShop();

      const autoColorOn = Boolean(extra.autoColorCycle);
      setAutoColorEnabled(autoColorOn);
      const autoColorChk = document.getElementById("togAutoColorCycle");
      if (autoColorChk) autoColorChk.checked = autoColorOn;

      const bizName = s.business_name || "Sammyreks Business Center";
      document.title = partner ? `Shop with ${partner.name} — ${bizName}` : bizName;

      const nameEl = document.getElementById("brandNameDisplay");
      if (nameEl) nameEl.textContent = bizName;

      const tagEl = document.getElementById("brandTaglineDisplay");
      if (tagEl) {
        if (s.tagline) {
          tagEl.textContent = s.tagline;
          tagEl.classList.remove("d-none");
        } else {
          tagEl.classList.add("d-none");
        }
      }

      const noticeEl = document.getElementById("activeNoticeBanner");
      if (noticeEl) {
        const bannerText = partner ? (partner.tagline || "") : (s.active_notice || "");
        if (bannerText) {
          noticeEl.textContent = bannerText;
          noticeEl.classList.remove("d-none");
        } else {
          noticeEl.classList.add("d-none");
        }
      }

      const broadcastBox = document.getElementById("broadcastVideoContainer");
      const broadcastPlayer = document.getElementById("broadcastVideoPlayer");
      if (broadcastBox && broadcastPlayer) {
        if (!partner && s.broadcast_video_url && isSafeMediaUrl(s.broadcast_video_url)) {
          broadcastPlayer.src = s.broadcast_video_url;
          broadcastBox.classList.remove("d-none");
        } else {
          broadcastPlayer.removeAttribute("src");
          broadcastBox.classList.add("d-none");
        }
      }

      const toggles = {
        togShowAnalytics: extra.showAnalytics !== false,
        togShowStockAlerts: extra.showStockAlerts !== false,
        togShowRequestTab: extra.showRequestTab !== false,
        togShowLiveCartBadge: extra.showLiveCartBadge !== false,
        togShowChatReceiptsTab: extra.showChatReceiptsTab !== false,
        togShowHeaderCartBtn: extra.showHeaderCartBtn !== false,
        togShowWatchAd: extra.showWatchAd !== false,
        togShowVendorTags: extra.showVendorTags !== false,
        togShowAvailability: extra.showAvailability !== false,
        togHideOutOfStock: Boolean(extra.hideOutOfStock),
        togAutoGeneratePin: extra.autoGeneratePin !== false,
        togShowRotatingTips: extra.showRotatingTips !== false,
        togShowFloatingAwareness: Boolean(extra.showFloatingAwareness),
        togAutoSlidePhotos: extra.autoSlidePhotos !== false
      };

      for (const [id, val] of Object.entries(toggles)) {
        const el = document.getElementById(id);
        if (el) el.checked = val;
      }

      const slideSecs = Math.min(120, Math.max(2, parseInt(extra.secondsPerSlide ?? 10, 10) || 10));
      const slideSecsInp = document.getElementById("setSlideSeconds");
      if (slideSecsInp) slideSecsInp.value = slideSecs;

      document.getElementById("navCartBtn")?.classList.toggle("d-none", !toggles.togShowHeaderCartBtn);
      document.getElementById("navChatBtn")?.classList.toggle("d-none", !toggles.togShowChatReceiptsTab);
      document.getElementById("bnavChatBtn")?.classList.toggle("d-none", !toggles.togShowChatReceiptsTab);
      document.getElementById("customRequestCol")?.classList.toggle("d-none", !toggles.togShowRequestTab);
      document.getElementById("bnavRequestBtn")?.classList.toggle("d-none", !toggles.togShowRequestTab);
      document.getElementById("analyticsKpiRow")?.classList.toggle("d-none", !toggles.togShowAnalytics);
      document.getElementById("stockAlertsLine")?.classList.toggle("d-none", !toggles.togShowStockAlerts);
      document.getElementById("rotatingTipStrip")?.classList.toggle("d-none", !toggles.togShowRotatingTips);

      const tipsRaw = extra.rotatingTips || "";
      const parsedTips = parsePipeOrLineList(tipsRaw);
      if (parsedTips.length) {
        state.tips = parsedTips;
        state.tipIndex = 0;
        updateTipDisplay();
      }
      restartTipRotation(extra.secondsPerTip || 10);

      const bankText = partner
        ? String(partner.bank_details || "").trim()
        : String(extra.bankDetails || "").trim();

      for (const boxId of ["checkoutBankDetailsBox", "chatBankDetailsBox"]) {
        const box = document.getElementById(boxId);
        if (box) {
          if (bankText) {
            const storeOwnerLabel = partner ? `${partner.name} Payment Details` : "Bank / Transfer Details";
            box.innerHTML = `<div class="fw-bold text-warning mb-1">${escapeHtml(storeOwnerLabel)}</div><div style="white-space:pre-line;">${escapeHtml(bankText)}</div>`;
            box.classList.remove("d-none");
          } else {
            box.classList.add("d-none");
          }
        }
      }

      const pinHelper = String(extra.pinHelperMsg || "").trim();
      const chatStatusEl = document.getElementById("custChatAuthStatus");
      if (chatStatusEl && !state.customerChat.unlocked) {
        chatStatusEl.textContent = pinHelper || "Enter your phone number and PIN or Order Reference Code.";
      }

      const pinWrap = document.getElementById("checkoutPinFieldWrap");
      const pinLabel = document.getElementById("checkoutPinLabel");
      if (pinLabel && extra.pinFieldLabel) pinLabel.textContent = extra.pinFieldLabel;
      if (pinWrap) pinWrap.classList.toggle("d-none", toggles.togAutoGeneratePin && !extra.pinFieldLabel);

      const notesInp = document.getElementById("checkoutNotes");
      if (notesInp && extra.orderNotePlaceholder) notesInp.placeholder = extra.orderNotePlaceholder;

      const slideUrls = parsePipeOrLineList(extra.awarenessSlides || s.awareness_image_url || "");
      const slideDescs = parsePipeOrLineList(extra.awarenessDescriptions || "");
      const bottomCaption = String(extra.awarenessBottomCaption || "").trim();

      awarenessSlidesList = slideUrls.map((url, i) => ({
        url,
        description: slideDescs[i] || bottomCaption || `Slide ${i + 1}`
      }));
      awarenessSlideIdx = 0;

      const toggleBtn = document.getElementById("toggleAwarenessBtn");
      const hasAwareness = Boolean(awarenessSlidesList.length || bottomCaption);
      if (toggleBtn) toggleBtn.classList.toggle("d-none", !hasAwareness);

      startAwarenessSlideshow(toggles.togAutoSlidePhotos);
      toggleAwarenessCard(!partner && toggles.togShowFloatingAwareness);

      const inputs = {
        setBusinessName: bizName,
        setTagline: s.tagline || "",
        setCurrency: s.currency || "₦",
        setActiveNotice: s.active_notice || "",
        setBroadcastVideoUrl: s.broadcast_video_url || "",
        setFooterCopyright: extra.footerCopyright || "",
        setReceiptFooter: extra.receiptFooter || "",
        setSearchPlaceholder: extra.searchPlaceholder || "Search products, brands, or sponsors...",
        setBankDetails: String(extra.bankDetails || "").trim(),
        setPinHelperMsg: pinHelper,
        setPinFieldLabel: extra.pinFieldLabel || "4-Digit Chat PIN (leave blank — auto)",
        setOrderNotePlaceholder: extra.orderNotePlaceholder || "",
        setSecondsPerTip: extra.secondsPerTip ?? 10,
        setRotatingTips: tipsRaw,
        setSlideSeconds: slideSecs,
        setAwarenessSlides: extra.awarenessSlides || (s.awareness_image_url || ""),
        setAwarenessDescriptions: extra.awarenessDescriptions || "",
        setAwarenessBottomCaption: bottomCaption
      };
      for (const [id, val] of Object.entries(inputs)) {
        const el = document.getElementById(id);
        if (el) el.value = val;
      }

      const searchInp = document.getElementById("storeSearchInput");
      if (searchInp && inputs.setSearchPlaceholder) {
        searchInp.placeholder = inputs.setSearchPlaceholder;
      }

      renderAwarenessSlidesManager();
      updateCartBadge();
      renderProductsGrid();
    }

    async function saveAppSettings(event) {
      event.preventDefault();
      const fb = document.getElementById("settingsFeedbackText");
      const btn = document.getElementById("saveSettingsSubmitBtn");
      const form = document.getElementById("appSettingsForm");
      if (!form) return;

      if (btn) btn.disabled = true;
      if (fb) {
        fb.className = "small text-secondary";
        fb.textContent = "Saving settings...";
      }

      try {
        const autoColorEnabled = Boolean(document.getElementById("togAutoColorCycle")?.checked);
        const slideSeconds = Math.min(120, Math.max(2, parseInt(document.getElementById("setSlideSeconds")?.value || "10", 10) || 10));
        const slidesText = document.getElementById("setAwarenessSlides")?.value || "";
        const descriptionsText = document.getElementById("setAwarenessDescriptions")?.value || "";
        const bottomCaption = (document.getElementById("setAwarenessBottomCaption")?.value || "").trim();

        const extraSettings = {
          autoColorCycle: autoColorEnabled,
          showAnalytics: Boolean(document.getElementById("togShowAnalytics")?.checked),
          showStockAlerts: Boolean(document.getElementById("togShowStockAlerts")?.checked),
          showRequestTab: Boolean(document.getElementById("togShowRequestTab")?.checked),
          showLiveCartBadge: Boolean(document.getElementById("togShowLiveCartBadge")?.checked),
          showChatReceiptsTab: Boolean(document.getElementById("togShowChatReceiptsTab")?.checked),
          showHeaderCartBtn: Boolean(document.getElementById("togShowHeaderCartBtn")?.checked),
          showWatchAd: Boolean(document.getElementById("togShowWatchAd")?.checked),
          showVendorTags: Boolean(document.getElementById("togShowVendorTags")?.checked),
          showAvailability: Boolean(document.getElementById("togShowAvailability")?.checked),
          hideOutOfStock: Boolean(document.getElementById("togHideOutOfStock")?.checked),
          autoGeneratePin: Boolean(document.getElementById("togAutoGeneratePin")?.checked),
          showRotatingTips: Boolean(document.getElementById("togShowRotatingTips")?.checked),
          showFloatingAwareness: Boolean(document.getElementById("togShowFloatingAwareness")?.checked),
          autoSlidePhotos: Boolean(document.getElementById("togAutoSlidePhotos")?.checked),
          secondsPerSlide: slideSeconds,
          secondsPerTip: parseInt(document.getElementById("setSecondsPerTip")?.value || "10", 10) || 10,
          rotatingTips: document.getElementById("setRotatingTips")?.value || "",
          searchPlaceholder: document.getElementById("setSearchPlaceholder")?.value || "Search products, brands, or sponsors...",
          bankDetails: document.getElementById("setBankDetails")?.value || "",
          pinHelperMsg: document.getElementById("setPinHelperMsg")?.value || "",
          pinFieldLabel: document.getElementById("setPinFieldLabel")?.value || "4-Digit Chat PIN (leave blank — auto)",
          orderNotePlaceholder: document.getElementById("setOrderNotePlaceholder")?.value || "",
          footerCopyright: document.getElementById("setFooterCopyright")?.value || "",
          receiptFooter: document.getElementById("setReceiptFooter")?.value || "",
          awarenessSlides: slidesText,
          awarenessDescriptions: descriptionsText,
          awarenessBottomCaption: bottomCaption
        };

        const fd = new FormData(form);
        fd.append("extra_settings_json", JSON.stringify(extraSettings));

        const res = await fetch("/api/settings", {
          method: "POST",
          headers: getStaffHeaders(),
          body: fd
        });
        if (handleStaffUnauthorized(res)) return;
        const data = await safeJson(res);
        if (!res.ok || data.ok === false) throw new Error(data.detail || "Could not save settings");

        if (data.settings) {
          state.settings = { ...state.settings, ...data.settings };
          state.settings.extra_settings = {
            ...extraSettings,
            ...(typeof data.settings.extra_settings === "object" ? data.settings.extra_settings : {})
          };
        } else {
          state.settings.extra_settings = extraSettings;
        }

        const vidFileInp = document.getElementById("setBroadcastVideoFile");
        if (vidFileInp) vidFileInp.value = "";

        applySettingsToUI();
        setAutoColorEnabled(autoColorEnabled);

        if (fb) {
          fb.className = "small text-success fw-semibold";
          fb.textContent = "All settings saved!";
        }
      } catch (err) {
        if (fb) {
          fb.className = "small text-danger";
          fb.textContent = err.message;
        }
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function loadShops() {
      try {
        const res = await fetch("/api/shops", { headers: getStaffHeaders() });
        const data = await safeJson(res);
        state.shops = res.ok && Array.isArray(data.shops) ? data.shops : [];
      } catch {
        state.shops = [];
      }
      renderSidebarShopsList();
      populateStaffShopSelector();
    }

    function renderSidebarShopsList() {
      const listEl = document.getElementById("sidebarPartnerShopsList");
      const badgeEl = document.getElementById("sidebarShopCountBadge");
      const mainCard = document.getElementById("sidebarMainStoreCard");
      if (!listEl) return;

      const partnerShops = state.shops.filter(sh => sh.slug && sh.slug !== "main");
      if (badgeEl) badgeEl.textContent = String(partnerShops.length);
      if (mainCard) mainCard.classList.toggle("active-shop", state.selectedShopId === "main");

      if (!partnerShops.length) {
        listEl.innerHTML = `<div class="small text-secondary py-2">No registered partner businesses yet.</div>`;
        return;
      }

      listEl.innerHTML = partnerShops.map(sh => {
        const isCurrent = state.selectedShopId === sh.slug;
        const cleanLoc = stripMarketLabel(sh.location || "Calabar") || "Calabar";
        const safeSlug = escapeJsAttr(sh.slug);
        const avatarHtml = (sh.avatar_url && isSafeMediaUrl(sh.avatar_url))
          ? `<img src="${escapeHtml(sh.avatar_url)}" alt="" class="rounded" style="width:42px;height:42px;object-fit:cover;border:1px solid var(--border-subtle);" />`
          : `<div class="brand-icon-badge" style="width:42px;height:42px;">
               <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <path d="M3 9l1.5-5h15L21 9"></path>
                 <path d="M5 11.5V20h14v-8.5"></path>
                 <rect x="9" y="13" width="6" height="4" rx="1"></rect>
               </svg>
             </div>`;

        return `
          <div class="sidebar-shop-card ${isCurrent ? "active-shop" : ""}">
            <div class="d-flex align-items-start gap-2 mb-2">
              ${avatarHtml}
              <div class="flex-grow-1 min-w-0">
                <div class="fw-bold text-light text-truncate">Shop with ${escapeHtml(sh.name)}</div>
                <div class="small text-info">Location: <strong>${escapeHtml(cleanLoc)}</strong></div>
                ${sh.phone ? `<div class="text-secondary" style="font-size:0.74rem;">Contact: ${escapeHtml(sh.phone)}</div>` : ""}
              </div>
            </div>
            <button type="button" class="btn btn-sm ${isCurrent ? "btn-info text-dark" : "btn-outline-warning"} fw-bold w-100" data-bs-dismiss="offcanvas" onclick="enterPartnerStorefront('${safeSlug}')">
              ${isCurrent ? "Currently Shopping Here" : `Shop / Buy with ${escapeHtml(sh.name)}`}
            </button>
          </div>
        `;
      }).join("");
    }

    async function enterMainStorefront() {
      state.selectedShopId = "main";
      state.cart = [];
      updateCartBadge();

      document.getElementById("staffSection")?.classList.add("d-none");
      document.getElementById("storefrontSection")?.classList.remove("d-none");
      document.getElementById("partnerStoreFrontHeader")?.classList.add("d-none");
      document.getElementById("bnavHomeBtn")?.classList.add("active");

      renderSidebarShopsList();
      applySettingsToUI();
      syncHeaderState(false);
      await loadProducts("main");
    }

    async function enterPartnerStorefront(shopSlug) {
      const partner = state.shops.find(s => s.slug === shopSlug);
      if (!partner) {
        await enterMainStorefront();
        return;
      }

      state.selectedShopId = partner.slug;
      state.cart = [];
      updateCartBadge();

      document.getElementById("staffSection")?.classList.add("d-none");
      document.getElementById("storefrontSection")?.classList.remove("d-none");
      document.getElementById("bnavHomeBtn")?.classList.remove("active");

      const hero = document.getElementById("partnerStoreFrontHeader");
      const heroTitle = document.getElementById("partnerHeroTitle");
      const heroMeta = document.getElementById("partnerHeroMeta");
      const heroAvatar = document.getElementById("partnerHeroAvatar");
      const heroFallback = document.getElementById("partnerHeroFallbackIcon");

      const cleanLoc = stripMarketLabel(partner.location || "Calabar") || "Calabar";
      if (heroTitle) heroTitle.textContent = `Shop with ${partner.name}`;
      if (heroMeta) {
        const parts = [`Location: ${cleanLoc}`];
        if (partner.phone) parts.push(`Phone: ${partner.phone}`);
        heroMeta.textContent = parts.join(" • ");
      }

      if (partner.avatar_url && isSafeMediaUrl(partner.avatar_url) && heroAvatar && heroFallback) {
        heroAvatar.src = partner.avatar_url;
        heroAvatar.classList.remove("d-none");
        heroFallback.classList.add("d-none");
      } else if (heroAvatar && heroFallback) {
        heroAvatar.removeAttribute("src");
        heroAvatar.classList.add("d-none");
        heroFallback.classList.remove("d-none");
      }

      hero?.classList.remove("d-none");

      renderSidebarShopsList();
      applySettingsToUI();
      syncHeaderState(false);
      await loadProducts(partner.slug);
    }

    function openRegisterShopModal() {
      const fb = document.getElementById("registerShopFeedback");
      const notice = document.getElementById("registerShopNotice");
      if (fb) fb.innerHTML = "";
      if (notice) {
        notice.textContent = isSuperAdmin()
          ? "Register a business with its store location. Customers will see it in the Stores sidebar and enter its dedicated storefront."
          : "Sign in as Super Admin (CEO) first to activate a new business storefront.";
      }
      getModal("registerShopModal")?.show();
    }

    async function submitPartnerShop(event) {
      event.preventDefault();
      const fb = document.getElementById("registerShopFeedback");
      if (!isSuperAdmin()) {
        if (fb) fb.innerHTML = `<span class="text-danger">Please log in as Super Admin (CEO) to register a business.</span>`;
        return;
      }

      const form = document.getElementById("registerShopForm");
      if (!form) return;

      try {
        const fd = new FormData(form);
        fd.set("location", stripMarketLabel(fd.get("location") || "Calabar") || "Calabar");
        const res = await fetch("/api/shops", {
          method: "POST",
          headers: getStaffHeaders(),
          body: fd
        });
        if (handleStaffUnauthorized(res)) return;
        const data = await safeJson(res);
        if (!res.ok || data.ok === false) {
          throw new Error(data.detail || "Could not register business");
        }
        form.reset();
        if (fb) fb.innerHTML = `<span class="text-success">Business "${escapeHtml(data.shop?.name || "")}" registered in Stores sidebar!</span>`;
        await loadShops();
        renderPartnerShopsAdminList();
      } catch (err) {
        if (fb) fb.innerHTML = `<span class="text-danger">${escapeHtml(err.message)}</span>`;
      }
    }

    function syncHeaderState(inDashboard) {
      const badge = document.getElementById("staffSessionBadge");
      const loginBtn = document.getElementById("navLoginBtn");
      const dashBtn = document.getElementById("navDashboardBtn");
      const logoutBtn = document.getElementById("navLogoutBtn");
      const storeBtn = document.getElementById("navStorefrontBtn");

      storeBtn?.classList.toggle("active", !inDashboard && state.selectedShopId === "main");
      dashBtn?.classList.toggle("active", inDashboard);

      if (isStaffLoggedIn()) {
        if (badge) {
          badge.textContent = `${state.staff.username} (${state.staff.role})`;
          badge.classList.remove("d-none");
        }
        loginBtn?.classList.add("d-none");
        dashBtn?.classList.remove("d-none");
        logoutBtn?.classList.remove("d-none");
      } else {
        badge?.classList.add("d-none");
        loginBtn?.classList.remove("d-none");
        dashBtn?.classList.add("d-none");
        logoutBtn?.classList.add("d-none");
      }
    }

    function populatePartnerOwnSettingsForm(shopObj) {
      if (!shopObj) return;
      document.getElementById("pSetName").value = shopObj.name || "";
      document.getElementById("pSetLocation").value = stripMarketLabel(shopObj.location || "Calabar") || "Calabar";
      document.getElementById("pSetPhone").value = shopObj.phone || "";
      document.getElementById("pSetTagline").value = shopObj.tagline || "";
      document.getElementById("pSetBankDetails").value = shopObj.bank_details || "";
    }

    async function savePartnerOwnSettings(event) {
      event.preventDefault();
      const fb = document.getElementById("partnerConfigFeedback");
      const shopSlug = state.staff.shop_id;
      if (!shopSlug || shopSlug === "main") return;

      const form = document.getElementById("partnerOwnSettingsForm");
      const fd = new FormData(form);
      fd.set("location", stripMarketLabel(fd.get("location") || "Calabar") || "Calabar");

      if (fb) {
        fb.className = "small text-secondary";
        fb.textContent = "Saving store configuration...";
      }

      try {
        const res = await fetch(`/api/shops/${encodeURIComponent(shopSlug)}`, {
          method: "POST",
          headers: getStaffHeaders(),
          body: fd
        });
        if (handleStaffUnauthorized(res)) return;
        const data = await safeJson(res);
        if (!res.ok || data.ok === false) throw new Error(data.detail || "Could not update store configuration");
        await loadShops();
        const updatedShop = state.shops.find(s => s.slug === shopSlug) || data.shop;
        if (updatedShop) {
          populatePartnerOwnSettingsForm(updatedShop);
          const dashTitle = document.getElementById("dashboardHeadingTitle");
          if (dashTitle) dashTitle.textContent = `${updatedShop.name} — Business Control`;
        }
        if (fb) {
          fb.className = "small text-success fw-semibold";
          fb.textContent = "Store configuration updated!";
        }
      } catch (err) {
        if (fb) {
          fb.className = "small text-danger";
          fb.textContent = err.message;
        }
      }
    }

    function buildSponsorBadgeHtml(sponsorName) {
      const cleanSponsor = stripMarketLabel(sponsorName);
      if (!cleanSponsor) return "";
      return `
        <span class="sponsor-pos-badge" title="Point of Service / Sponsor">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l1.5-5h15L21 9"></path>
            <path d="M5 11.5V20h14v-8.5"></path>
            <rect x="9" y="13" width="6" height="4" rx="1"></rect>

    async function loadProducts(shopId = "main") {
      try {
        const res = await fetch(`/api/products?shop_id=${encodeURIComponent(shopId)}`);
        const data = await safeJson(res);
        state.products = res.ok && Array.isArray(data.products) ? data.products : [];
      } catch {
        state.products = [];
      }
      populateCategoryFilter();
      renderProductsGrid();
      if (isStaffLoggedIn()) {
        renderStaffInventoryTable();
        populatePosProductSelect();
        renderStockAlerts();
      }
    }

    function populateCategoryFilter() {
      const sel = document.getElementById("storeCategoryFilter");
      if (!sel) return;
      const prev = sel.value || "All";
      const cats = new Set(["All"]);
      for (const p of state.products) {
        if (p.category) cats.add(p.category);
      }
      sel.innerHTML = Array.from(cats)
        .map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c === "All" ? "All Categories" : c)}</option>`)
        .join("");
      sel.value = cats.has(prev) ? prev : "All";
    }

    function renderProductsGrid() {
      const grid = document.getElementById("productsGrid");
      if (!grid) return;

      const extra = getExtraSettings();
      const showWatchAd = extra.showWatchAd !== false;
      const showVendorTags = extra.showVendorTags !== false;
      const showAvailability = extra.showAvailability !== false;
      const hideOutOfStock = Boolean(extra.hideOutOfStock);

      const q = (document.getElementById("storeSearchInput")?.value || "").trim().toLowerCase();
      const cat = document.getElementById("storeCategoryFilter")?.value || "All";

      const filtered = state.products.filter(p => {
        const stockNum = Number(p.qty_cartons ?? p.stock ?? 0);
        if (hideOutOfStock && stockNum <= 0) return false;
        if (cat !== "All" && p.category !== cat) return false;
        if (!q) return true;
        return `${p.name} ${p.category} ${p.vendor_name} ${p.description}`.toLowerCase().includes(q);
      });

      if (!filtered.length) {
        grid.innerHTML = `
          <div class="col-12">
            <div class="dark-panel text-center text-secondary py-4">
              No products listed in this store yet.
            </div>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const stockNum = Number(p.qty_cartons ?? p.stock ?? 0);
        const inStock = stockNum > 0;
        const hasImage = Boolean(p.image_url) && isSafeMediaUrl(p.image_url);
        const hasVideo = Boolean(p.video_url) && isSafeMediaUrl(p.video_url);
        const safeId = escapeJsAttr(p.id);

        let mediaHtml = `<div class="text-secondary small py-4">No image</div>`;
        if (hasImage) {
          mediaHtml = `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}" loading="lazy" />`;
        } else if (hasVideo) {
          mediaHtml = `<video src="${escapeHtml(p.video_url)}" playsinline muted preload="metadata"></video>`;
        }

        const videoBadgeHtml = hasVideo
          ? `<span class="media-video-indicator" title="Video Advert Attached">▶ Video Ad</span>`
          : "";

        const mediaSwitchHtml = showWatchAd
          ? `<button type="button" class="media-switch-btn" onclick="openProductAdvertModal('${safeId}')">▶ Watch Ad</button>`
          : "";

        const mainLbl = escapeHtml(p.unit_main_label || "Carton");
        const packLbl = escapeHtml(p.unit_pack_label || "Pack");
        const retailLbl = escapeHtml(p.unit_retail_label || "Retail Unit");
        const packPrice = Number(p.price_pack || 0);
        const retailPrice = Number(p.price_retail || 0);

        const unitOpts = [`<option value="${mainLbl}">${mainLbl}</option>`];
        if (packPrice > 0) unitOpts.push(`<option value="${packLbl}">${packLbl} (${formatMoney(packPrice)})</option>`);
        if (retailPrice > 0) unitOpts.push(`<option value="${retailLbl}">${retailLbl} (${formatMoney(retailPrice)})</option>`);

        const sponsorHtml = showVendorTags ? buildSponsorBadgeHtml(p.vendor_name) : "";
        const availBadge = showAvailability
          ? `<span class="badge ${inStock ? "text-bg-success" : "text-bg-danger"}">${inStock ? "In Stock" : "Out of Stock"}</span>`
          : "";

        return `
          <div class="col-sm-6 col-md-4 col-xl-3">
            <div class="product-card">
              <div class="product-media-wrap">
                <span class="media-cat-tag">${escapeHtml(p.category || "General")}</span>
                ${mediaHtml}
                ${videoBadgeHtml}
                ${mediaSwitchHtml}
              </div>
              <div class="p-3 d-flex flex-column flex-grow-1">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                  <h6 class="fw-bold mb-0 text-light">${escapeHtml(p.name)}</h6>
                  ${availBadge}
                </div>

                ${sponsorHtml ? `<div class="mb-2">${sponsorHtml}</div>` : ""}

                <div class="d-flex flex-wrap gap-1 mb-2">
                  <span class="gold-price-tag">${mainLbl}: ${formatMoney(p.price_carton)}</span>
                  ${packPrice > 0 ? `<span class="tier-chip">${packLbl}: ${formatMoney(packPrice)}</span>` : ""}
                  ${retailPrice > 0 ? `<span class="tier-chip">${retailLbl}: ${formatMoney(retailPrice)}</span>` : ""}
                </div>

                ${p.description ? `<p class="small text-secondary mb-2">${escapeHtml(p.description)}</p>` : ""}

                <div class="mt-auto pt-2 border-top border-secondary-subtle">
                  <div class="row g-1">
                    <div class="col-6">
                      <select id="cardUnit_${escapeHtml(p.id)}" class="form-select form-select-sm dark-select">
                        ${unitOpts.join("")}
                      </select>
                    </div>
                    <div class="col-3">
                      <input id="cardQty_${escapeHtml(p.id)}" type="number" min="1" value="1" class="form-control form-control-sm dark-input" />
                    </div>
                    <div class="col-3">
                      <button type="button" class="btn btn-sm btn-warning fw-bold w-100" ${inStock ? "" : "disabled"} onclick="addToCart('${safeId}')">
                        Add
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function openProductAdvertModal(productId) {
      const p = state.products.find(item => item.id === productId);
      if (!p) return;
      activeAdvertProductId = p.id;

      document.getElementById("advertModalTitle").textContent = `${p.name || "Product"} — Product Advert`;
      document.getElementById("advertModalName").textContent = p.name || "";

      const sponsorEl = document.getElementById("advertModalSponsor");
      const sponsorBadge = buildSponsorBadgeHtml(p.vendor_name);
      sponsorEl.innerHTML = sponsorBadge;
      sponsorEl.classList.toggle("d-none", !sponsorBadge);

      const stockVal = Number(p.qty_cartons ?? p.stock ?? 0);
      const inStock = stockVal > 0;
      document.getElementById("advertModalAvail").innerHTML = `
        <span class="small text-secondary">Category: ${escapeHtml(p.category || "General")}</span>
        <span class="badge ms-2 ${inStock ? "text-bg-success" : "text-bg-danger"}">${inStock ? "In Stock" : "Out of Stock"}</span>
      `;

      const descEl = document.getElementById("advertModalDesc");
      descEl.textContent = p.description || "";
      descEl.classList.toggle("d-none", !p.description);

      const unitLbl = p.unit_main_label || "Carton";
      const priceLines = [`${unitLbl.toUpperCase()}: ${formatMoney(p.price_carton)}`];
      if (Number(p.price_pack || 0) > 0) {
        priceLines.push(`${(p.unit_pack_label || "Pack").toUpperCase()}: ${formatMoney(p.price_pack)}`);
      }
      if (Number(p.price_retail || 0) > 0) {
        priceLines.push(`${(p.unit_retail_label || "Retail Unit").toUpperCase()}: ${formatMoney(p.price_retail)}`);
      }
      document.getElementById("advertModalPrice").textContent = priceLines.join(" • ");

      const noVidBanner = document.getElementById("advertNoVideoBanner");
      const vidWrap = document.getElementById("advertVideoPlayerWrap");
      const vidEl = document.getElementById("advertModalVideo");

      if (p.video_url && isSafeMediaUrl(p.video_url)) {
        noVidBanner.classList.add("d-none");
        vidWrap.classList.remove("d-none");
        vidEl.src = p.video_url;
      } else {
        noVidBanner.classList.remove("d-none");
        vidWrap.classList.add("d-none");
        vidEl.removeAttribute("src");
        vidEl.load();
      }

      const imgEl = document.getElementById("advertModalImg");
      const noImgEl = document.getElementById("advertModalNoImg");
      if (p.image_url && isSafeMediaUrl(p.image_url)) {
        imgEl.src = p.image_url;
        imgEl.classList.remove("d-none");
        noImgEl.classList.add("d-none");
      } else {
        imgEl.removeAttribute("src");
        imgEl.classList.add("d-none");
        noImgEl.classList.remove("d-none");
      }

      getModal("productAdvertModal")?.show();
    }

    function stopAdvertVideo() {
      const vidEl = document.getElementById("advertModalVideo");
      if (vidEl) {
        vidEl.pause();
        vidEl.removeAttribute("src");
        vidEl.load();
      }
    }

    function addFromAdvertModal() {
      if (!activeAdvertProductId) return;
      const p = state.products.find(item => item.id === activeAdvertProductId);
      if (!p) return;
      const unit = p.unit_main_label || "Carton";
      const unitPrice = getUnitPrice(p, unit);
      const existing = state.cart.find(it => it.product_id === p.id && it.unit === unit);
      if (existing) {
        existing.qty += 1;
        existing.total_price = existing.qty * existing.unit_price;
      } else {
        state.cart.push({
          product_id: p.id,
          shop_id: p.shop_id || state.selectedShopId || "main",
          name: p.name,
          unit,
          qty: 1,
          unit_price: unitPrice,
          total_price: unitPrice
        });
      }
      updateCartBadge();
      stopAdvertVideo();
      getModal("productAdvertModal")?.hide();
      openCartModal();
    }

    function getUnitPrice(prod, unitLabel) {
      const mainLbl = prod.unit_main_label || "Carton";
      const packLbl = prod.unit_pack_label || "Pack";
      const retailLbl = prod.unit_retail_label || "Retail Unit";
      if (unitLabel === packLbl && Number(prod.price_pack || 0) > 0) return Number(prod.price_pack);
      if (unitLabel === retailLbl && Number(prod.price_retail || 0) > 0) return Number(prod.price_retail);
      if (unitLabel === mainLbl || Number(prod.price_carton || 0) > 0) return Number(prod.price_carton || 0);
      return Number(prod.price_retail || prod.price_pack || 0);
    }

    function addToCart(productId) {
      const prod = state.products.find(p => p.id === productId);
      if (!prod) return;
      const unit = document.getElementById(`cardUnit_${productId}`)?.value || (prod.unit_main_label || "Carton");
      const qty = Math.max(1, parseInt(document.getElementById(`cardQty_${productId}`)?.value || "1", 10) || 1);
      const unitPrice = getUnitPrice(prod, unit);

      const existing = state.cart.find(it => it.product_id === prod.id && it.unit === unit);
      if (existing) {
        existing.qty += qty;
        existing.total_price = existing.qty * existing.unit_price;
      } else {
        state.cart.push({
          product_id: prod.id,
          shop_id: prod.shop_id || state.selectedShopId || "main",
          name: prod.name,
          unit,
          qty,
          unit_price: unitPrice,
          total_price: unitPrice * qty
        });
      }
      updateCartBadge();
    }

    function updateCartBadge() {
      const badge = document.getElementById("topCartBadge");
      const bottomCount = document.getElementById("bottomCartCount");
      const showBadge = getExtraSettings().showLiveCartBadge !== false;
      const count = state.cart.reduce((sum, it) => sum + Number(it.qty || 1), 0);
      if (badge) {
        badge.textContent = String(count);
        badge.classList.toggle("d-none", !showBadge);
      }
      if (bottomCount) {
        bottomCount.textContent = String(count);
      }
    }

    function openCartModal() {
      const partner = getActivePartnerShop();
      const titleEl = document.getElementById("cartModalTitle");
      if (titleEl) {
        titleEl.textContent = partner ? `Cart — ${partner.name}` : "Shopping Cart — Sammyreks Business Center";
      }
      renderCartItems();
      const box = document.getElementById("checkoutResultBox");
      if (box) box.innerHTML = "";
      getModal("cartModal")?.show();
    }

    function renderCartItems() {
      const box = document.getElementById("cartItemsContainer");
      if (!box) return;
      if (!state.cart.length) {
        box.innerHTML = `<div class="text-secondary small text-center py-3">Your cart is empty.</div>`;
        return;
      }
      const total = state.cart.reduce((s, it) => s + Number(it.total_price || 0), 0);
      box.innerHTML = `
        <div class="d-flex flex-column gap-2 mb-2">
          ${state.cart.map((it, idx) => `
            <div class="dark-subpanel d-flex justify-content-between align-items-center gap-2">
              <div>
                <div class="fw-bold small">${escapeHtml(it.name)}</div>
                <div class="text-secondary" style="font-size:0.78rem;">${it.qty} × ${escapeHtml(it.unit)} @ ${formatMoney(it.unit_price)}</div>
              </div>
              <div class="d-flex align-items-center gap-2">
                <span class="fw-bold text-warning small">${formatMoney(it.total_price)}</span>
                <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2" onclick="removeCartItem(${idx})">×</button>
              </div>
            </div>
          `).join("")}
        </div>
        <div class="text-end fw-bold text-warning">Total: ${formatMoney(total)}</div>
      `;
    }

    function removeCartItem(idx) {
      state.cart.splice(idx, 1);
      updateCartBadge();
      renderCartItems();
    }

    function clearCart() {
      state.cart = [];
      updateCartBadge();
      renderCartItems();
    }

    async function submitCartOrder(event) {
      event.preventDefault();
      const resBox = document.getElementById("checkoutResultBox");
      if (!state.cart.length) {
        if (resBox) resBox.innerHTML = `<div class="alert alert-warning py-2 small mb-0">Add items to your cart first.</div>`;
        return;
      }
      const customer = (document.getElementById("checkoutCustomerName")?.value || "").trim() || "Customer";
      const phone = (document.getElementById("checkoutPhone")?.value || "").trim();
      const pin = (document.getElementById("checkoutPin")?.value || "").trim();
      const notes = (document.getElementById("checkoutNotes")?.value || "").trim();

      try {
        const res = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            shop_id: state.selectedShopId || "main",
            customer,
            contact_phone: phone,
            phone,
            pin,
            notes,
            items: state.cart
          })
        });
        const data = await safeJson(res);
        if (!res.ok || data.ok === false) throw new Error(data.detail || "Order failed");

        state.customerChat.phone = phone;
        state.customerChat.pin = data.customer_pin || pin || data.payment_ref || "";
        state.cart = [];
        updateCartBadge();
        renderCartItems();

        if (resBox) {
          resBox.innerHTML = `
            <div class="alert alert-success py-2 small mb-0">
              <div class="fw-bold">Order submitted!</div>
              <div>Reference Code: <strong>${escapeHtml(data.payment_ref)}</strong></div>
              <div>Chat PIN: <strong>${escapeHtml(data.customer_pin)}</strong></div>
            </div>`;
        }
      } catch (err) {
        if (resBox) resBox.innerHTML = `<div class="alert alert-danger py-2 small mb-0">${escapeHtml(err.message)}</div>`;
      }
    }

    async function unlockCustomerChat(event) {
      event.preventDefault();
      const phone = (document.getElementById("custChatPhone")?.value || "").trim();
      const pin = (document.getElementById("custChatPin")?.value || "").trim();
      await fetchCustomerChatMessages(phone, pin, false);

    async function fetchCustomerChatMessages(phone, pin, silent = false) {
      const stEl = document.getElementById("custChatAuthStatus");
      const badge = document.getElementById("customerChatSessionBadge");
      try {
        const url = `/api/messages?phone=${encodeURIComponent(phone)}&pin=${encodeURIComponent(pin)}&shop_id=${encodeURIComponent(state.selectedShopId || "main")}`;
        const res = await fetch(url);
        const data = await safeJson(res);
        if (res.status === 429) {
          if (!silent && stEl) {
            stEl.className = "small text-warning mb-2";
            stEl.textContent = data.detail || "Too many attempts. Please wait a moment and try again.";
          }
          return;
        }
        if (!res.ok) {
          if (!silent) {
            state.customerChat.unlocked = false;
            if (badge) {
              badge.className = "badge text-bg-danger";
              badge.textContent = "Locked";
            }
            if (stEl) {
              stEl.className = "small text-danger mb-2";
              stEl.textContent = data.detail || "Invalid phone number or PIN/Ref.";
            }
            renderCustomerChatMessages(false);
          }
          return;
        }
        const serverMsgs = Array.isArray(data.messages) ? data.messages : [];
        const pendingOpts = state.customerChat.messages.filter(
          m => String(m.id || "").startsWith("opt_") && !serverMsgs.some(s => String(s.id || "") === String(m.id || ""))
        );

        state.customerChat = {
          phone,
          pin,
          unlocked: true,
          messages: [...serverMsgs, ...pendingOpts]
        };
        if (badge) {
          badge.className = "badge text-bg-success";
          badge.textContent = `Connected • ${phone}`;
        }
        if (stEl && !silent) {
          stEl.className = "small text-success mb-2";
          stEl.textContent = `Unlocked chat for ${phone}`;
        }
        renderCustomerChatMessages(!silent);
      } catch (err) {
        if (!silent && stEl) {
          stEl.className = "small text-danger mb-2";
          stEl.textContent = err.message;
        }
      }
    }

    function renderCustomerChatMessages(forceScroll = false) {
      const box = document.getElementById("customerChatBox");
      if (!box) return;
      if (!state.customerChat.unlocked) {
        const helper = String(getExtraSettings().pinHelperMsg || "").trim();
        box.innerHTML = `<div data-empty-chat="1" class="text-secondary small text-center py-5">${escapeHtml(helper || "Enter your phone number and PIN or Reference Code above to open your chat thread.")}</div>`;
        return;
      }
      if (!state.customerChat.messages.length) {
        box.innerHTML = `<div data-empty-chat="1" class="text-secondary small text-center py-5">No messages yet. Send a message or add an image below.</div>`;
        return;
      }

      const prevCount = box.querySelectorAll(".wa-bubble").length;
      box.innerHTML = state.customerChat.messages
        .map(m => renderWhatsAppBubble(m, "customer", false))
        .join("");

      const hasNewMessages = state.customerChat.messages.length > prevCount;
      syncChatScroll(box, forceScroll || hasNewMessages);
    }

    async function sendCustomerChatMessage(event) {
      event.preventDefault();
      const stEl = document.getElementById("custChatAuthStatus");
      if (!state.customerChat.unlocked) {
        if (stEl) {
          stEl.className = "small text-warning mb-2";
          stEl.textContent = "Please unlock the chat with your phone number and PIN/Ref first.";
        }
        return;
      }
      const txtEl = document.getElementById("custMsgText");
      const fileEl = document.getElementById("custMsgProofFile");
      const text = (txtEl?.value || "").trim();
      const file = fileEl?.files?.[0] || null;
      if (!text && !file) return;

      const tempPreviewUrl = file ? trackObjectUrl(file) : "";
      const optimisticMsg = {
        id: `opt_${Date.now()}`,
        sender: "Customer",
        customer_phone: state.customerChat.phone,
        message: text,
        proof_url: tempPreviewUrl,
        timestamp: formatNowTime()
      };
      state.customerChat.messages.push(optimisticMsg);
      if (txtEl) txtEl.value = "";
      clearCustomerAttachment();
      appendImmediateBubble("customerChatBox", optimisticMsg, "customer", false);

      const fd = new FormData();
      fd.append("phone", state.customerChat.phone);
      fd.append("sender", "Customer");
      fd.append("text", text);
      fd.append("pin", state.customerChat.pin);
      fd.append("shop_id", state.selectedShopId || "main");
      if (file) fd.append("proof_file", file);

      try {
        const res = await fetch("/api/messages", { method: "POST", body: fd });
        const data = await safeJson(res);
        if (!res.ok || data.ok === false) throw new Error(data.detail || "Send failed");
        revokeObjectUrl(tempPreviewUrl);
        await fetchCustomerChatMessages(state.customerChat.phone, state.customerChat.pin, true);
      } catch (err) {
        if (stEl) {
          stEl.className = "small text-danger mb-2";
          stEl.textContent = err.message;
        }
      }
    }
