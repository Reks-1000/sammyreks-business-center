    async function lookupSingleBarcode() {
      const code = (document.getElementById("barcodeLookupInput")?.value || "").trim();
      const stEl = document.getElementById("barcodeLookupStatus");
      if (!code) {
        if (stEl) {
          stEl.className = "small text-warning mt-1";
          stEl.textContent = "Type a barcode or item name first.";
        }
        return;
      }
      if (stEl) {
        stEl.className = "small text-secondary mt-1";
        stEl.textContent = `Searching "${code}"...`;
      }

      try {
        const category = encodeURIComponent(getChosenAutoStockCategory());
        const loc = encodeURIComponent((document.getElementById("autoStockLocationInput")?.value || document.getElementById("prodLocation")?.value || "Calabar").trim());
        const stock = encodeURIComponent(document.getElementById("autoStockDefaultCartons")?.value || document.getElementById("prodStockCartons")?.value || "5");
        const res = await fetch(
          `/api/auto-stock/barcode/${encodeURIComponent(code)}?category=${category}&location=${loc}&default_stock_cartons=${stock}&_=${Date.now()}`,
          { cache: "no-store", headers: getStaffHeaders() }
        );
        if (handleStaffUnauthorized(res)) return;
        const data = await safeJson(res);
        if (!res.ok || !data.item) throw new Error(data.detail || `No match found for "${code}"`);

        applyItemToProductForm(data.item);
        if (stEl) {
          stEl.className = "small text-success mt-1";
          stEl.textContent = `Loaded "${data.item.name}" under ${data.item.category}.`;
        }
      } catch (err) {
        if (stEl) {
          stEl.className = "small text-danger mt-1";
          stEl.textContent = err.message;
        }
      }
    }

    async function runNameBatchAutoStock(fillFirst = true) {
      const names = (document.getElementById("autoStockNamesInput")?.value || "").trim();
      const stEl = document.getElementById("autoStockBatchStatus");
      const category = getChosenAutoStockCategory();
      const defaultCartons = Math.max(0, parseFloat(document.getElementById("autoStockDefaultCartons")?.value || "5") || 0);
      const location = (document.getElementById("autoStockLocationInput")?.value || "Calabar").trim();

      if (!names) {
        clearStagedBatchUI("Enter one or more item names first.");
        return;
      }

      clearStagedBatchUI(`Searching "${names}"...`);

      try {
        const res = await fetch(`/api/auto-stock/search-names?_=${Date.now()}`, {
          method: "POST",
          cache: "no-store",
          headers: getStaffHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({
            product_names: names,
            category,
            default_stock_cartons: defaultCartons,
            location
          })
        });
        if (handleStaffUnauthorized(res)) return;
        const data = await safeJson(res);
        if (!res.ok || !Array.isArray(data.items) || !data.items.length) {
          throw new Error(data.detail || `Search returned no items for "${names}"`);
        }

        state.stagedBatchItems = data.items.map(it => ({ ...it, category: it.category || category }));
        if (fillFirst) {
          applyItemToProductForm(state.stagedBatchItems[0]);
        }
        renderStagedBatchPreview();
        if (stEl) {
          stEl.className = "small text-success mt-2";
          stEl.textContent = `Ready (${state.stagedBatchItems.length}) under ${category}: ${state.stagedBatchItems.map(x => x.name).join(", ")}`;
        }
      } catch (err) {
        clearStagedBatchUI("");
        if (stEl) {
          stEl.className = "small text-danger mt-2";
          stEl.textContent = err.message;
        }
      }
    }

    async function saveStagedBatchItems() {
      const checks = Array.from(document.querySelectorAll(".staged-item-check")).filter(c => c.checked);
      if (!checks.length) return;

      let saved = 0;
      for (const chk of checks) {
        const it = state.stagedBatchItems[parseInt(chk.dataset.idx, 10)];
        if (!it) continue;
        const fd = new FormData();
        fd.append("action_mode", "create");
        fd.append("shop_id", state.staffShopId === "all" ? "main" : (state.staffShopId || "main"));
        fd.append("name", it.name || "Item");
        fd.append("category", it.category || getChosenAutoStockCategory());
        fd.append("location", stripMarketLabel(it.location || "Calabar") || "Calabar");
        fd.append("vendor_name", stripMarketLabel(it.vendor_name || ""));
        fd.append("main_unit", it.main_unit || "Carton");
        fd.append("sub_unit", it.sub_unit || "Pack");
        fd.append("retail_unit", it.retail_unit || "Retail Unit");
        fd.append("price_carton", String(Math.max(0, Number(it.price_carton ?? 0) || 0)));
        fd.append("cost_price_carton", String(Math.max(0, Number(it.cost_price_carton ?? 0) || 0)));
        fd.append("stock_cartons", String(Math.max(0, Number(it.stock_cartons ?? 5) || 0)));
        fd.append("price_pack", String(Math.max(0, Number(it.price_pack ?? 0) || 0)));
        fd.append("packs_per_carton", String(Math.max(1, parseInt(it.packs_per_carton ?? 1, 10) || 1)));
        fd.append("price_retail", String(Math.max(0, Number(it.price_retail ?? 0) || 0)));
        fd.append("retail_per_pack", String(Math.max(1, parseInt(it.units_per_pack ?? 1, 10) || 1)));
        fd.append("image_url", it.image_url || "");
        fd.append("video_link", it.video_url || "");
        fd.append("description", it.description || "");

        const res = await fetch("/api/products", { method: "POST", headers: getStaffHeaders(), body: fd });
        if (handleStaffUnauthorized(res)) return;
        if (res.ok) saved += 1;
      }

      clearStagedBatchUI(`Saved ${saved} item(s).`);
      await loadProducts(state.staffShopId || "main");
    }

      const prod = state.products.find(p => p.id === prodId);

          <div class="text-center mt-2 pt-2 border-top" style="font-size:0.75rem;">${escapeHtml(footerMsg)}</div>

    function renderStaffChatThreads() {
      const list = document.getElementById("staffChatThreadsList");
      if (!list) return;
      const activeDigits = normalizePhoneDigits(document.getElementById("staffChatPhoneFilter")?.value || "");

      const threadMap = new Map();
      for (const o of state.orders) {
        const ph = String(o.contact_phone || "").trim();
        const digits = normalizePhoneDigits(ph);
        if (!digits) continue;
        if (!threadMap.has(digits)) {
          threadMap.set(digits, {
            phone: ph,
            digits,
            name: o.customer || "Customer",
            preview: `Order ${o.payment_ref || ""}`,
            time: o.timestamp || ""
          });
        }
      }

      for (const m of state.staffMessages) {
        const ph = String(m.customer_phone || m.phone || "").trim();
        const digits = normalizePhoneDigits(ph);
        if (!digits) continue;
        const txt = m.proof_url
          ? "🖼 Sent an image / receipt"
          : String(m.message || m.text || "").replace(/<[^>]*>/g, "").trim() || "Message";
        const existing = threadMap.get(digits);
        threadMap.set(digits, {
          phone: ph || existing?.phone || digits,
          digits,
          name: existing?.name || "Customer",
          preview: txt,
          time: m.timestamp || existing?.time || ""
        });
      }

      const threads = Array.from(threadMap.values());
      if (!threads.length) {
        list.innerHTML = `<div class="small text-secondary py-2">No active customer chats yet.</div>`;
        return;
      }

      list.innerHTML = threads.map(t => {
        const isSelected = activeDigits && (t.digits === activeDigits || t.digits.includes(activeDigits) || activeDigits.includes(t.digits));
        return `
          <button type="button" class="wa-thread-item ${isSelected ? "active" : ""}" onclick="focusStaffChatPhone('${escapeJsAttr(t.phone)}')">
            <div class="d-flex justify-content-between align-items-center gap-2">
              <strong class="small text-light">${escapeHtml(t.name)} • <span class="text-warning">${escapeHtml(t.phone)}</span></strong>
              <span style="font-size:0.68rem;" class="text-secondary">${escapeHtml(t.time)}</span>
            </div>
            <div class="small text-secondary text-truncate mt-1">${escapeHtml(t.preview)}</div>
          </button>
        `;
      }).join("");
    }

    async function loadStaffMessages(qShop, silent = false) {
      try {
        const res = await fetch(`/api/messages?shop_id=${qShop}`, { headers: getStaffHeaders() });
        if (handleStaffUnauthorized(res)) return;
        const data = await safeJson(res);
        if (res.ok && Array.isArray(data.messages)) {
          const serverMsgs = data.messages;
          const pendingOpts = state.staffMessages.filter(
            m => String(m.id || "").startsWith("opt_") && !serverMsgs.some(s => String(s.id || "") === String(m.id || ""))
          );
          state.staffMessages = [...serverMsgs, ...pendingOpts];
        } else if (!silent) {
          state.staffMessages = [];
        }
      } catch {
        if (!silent) state.staffMessages = [];
      }
      renderStaffChatThreads();
      renderStaffChatMessages(!silent);
    }

    function renderStaffChatMessages(forceScroll = false) {
      const box = document.getElementById("staffChatMessagesBox");
      if (!box) return;
      const rawFilter = (document.getElementById("staffChatPhoneFilter")?.value || "").trim();
      const normFilter = normalizePhoneDigits(rawFilter);

      const rows = state.staffMessages.filter(m => {
        if (!normFilter) return true;
        const msgPhone = normalizePhoneDigits(m.customer_phone || m.phone || "");
        return msgPhone.includes(normFilter) || normFilter.includes(msgPhone);
      });

      const prevCount = box.querySelectorAll(".wa-bubble").length;
      box.innerHTML = rows.length
        ? rows.map(m => renderWhatsAppBubble(m, "staff", true)).join("")
        : `<div data-empty-chat="1" class="text-secondary small text-center py-5">No messages in this conversation.</div>`;

      const hasNewMessages = rows.length > prevCount;
      syncChatScroll(box, forceScroll || hasNewMessages);
    }

    async function sendStaffChatReply(event) {
      event.preventDefault();
      const phone = (document.getElementById("staffReplyPhone")?.value || "").trim();
      const text = (document.getElementById("staffReplyText")?.value || "").trim();
      const file = document.getElementById("staffReplyProofFile")?.files?.[0] || null;
      if (!phone || (!text && !file)) return;

      const tempPreviewUrl = file ? trackObjectUrl(file) : "";
      const optimisticMsg = {
        id: `opt_${Date.now()}`,
        sender: "Staff",
        customer_phone: phone,
        message: text,
        proof_url: tempPreviewUrl,
        timestamp: formatNowTime()
      };
      state.staffMessages.push(optimisticMsg);
      document.getElementById("staffReplyText").value = "";
      clearStaffAttachment();
      renderStaffChatThreads();

      const filterDigits = normalizePhoneDigits(document.getElementById("staffChatPhoneFilter")?.value || "");
      const phoneDigits = normalizePhoneDigits(phone);
      if (!filterDigits || phoneDigits.includes(filterDigits) || filterDigits.includes(phoneDigits)) {
        appendImmediateBubble("staffChatMessagesBox", optimisticMsg, "staff", true);
      }

      const fd = new FormData();
      fd.append("phone", phone);
      fd.append("sender", "Staff");
      fd.append("text", text);
      fd.append("shop_id", state.staffShopId === "all" ? "main" : (state.staffShopId || "main"));
      if (file) fd.append("proof_file", file);

      const res = await fetch("/api/messages", { method: "POST", headers: getStaffHeaders(), body: fd });
      if (handleStaffUnauthorized(res)) return;
      if (res.ok) {
        revokeObjectUrl(tempPreviewUrl);
        await loadStaffMessages(encodeURIComponent(state.staffShopId || "main"), true);
      }
    }

      if (handleStaffUnauthorized(res)) return;
      if (res.ok) {
        const qShop = encodeURIComponent(state.staffShopId || "main");
        await Promise.all([loadStaffExpenses(qShop), loadStaffAnalytics(qShop)]);
      }
    }

    async function loadStaffWorkers() {
      try {
        const res = await fetch("/api/workers", { headers: getStaffHeaders() });
        if (handleStaffUnauthorized(res)) return;
        const data = await safeJson(res);
        state.workers = res.ok && Array.isArray(data.workers) ? data.workers : [];
      } catch {
        state.workers = [];
      }
      const box = document.getElementById("workersList");
      if (!box) return;
      box.innerHTML = state.workers.length
        ? state.workers.map(w => `
            <div class="dark-subpanel small d-flex justify-content-between align-items-center gap-2">
              <div>
                <strong>${escapeHtml(w.name || w.username)}</strong> <span class="badge text-bg-secondary">${escapeHtml(w.role || "Staff")}</span>
                <div class="text-secondary">@${escapeHtml(w.username || "")} • ${escapeHtml(w.shop_id || "main")}</div>
              </div>
              ${isSuperAdmin() ? `<button type="button" class="btn btn-sm btn-outline-danger py-0 px-2" onclick="deleteWorker('${escapeJsAttr(w.id)}')">Del</button>` : ""}
            </div>`).join("")
        : `<div class="text-secondary small">No workers listed.</div>`;
    }

    async function submitWorkerForm(event) {
      event.preventDefault();
      if (!isSuperAdmin()) return;
      const res = await fetch("/api/workers", {
        method: "POST",
        headers: getStaffHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({
          name: document.getElementById("workerName").value.trim(),
          username: document.getElementById("workerUsername").value.trim(),
          role: document.getElementById("workerRole").value.trim() || "Staff",
          password: document.getElementById("workerPassword").value,
          shop_id: state.staffShopId === "all" ? "main" : (state.staffShopId || "main")
        })
      });
      if (handleStaffUnauthorized(res)) return;
      if (res.ok) {
        document.getElementById("workerForm").reset();
        await loadStaffWorkers();
      }
    }

    async function deleteWorker(id) {
      if (!isSuperAdmin()) return;
      const res = await fetch(`/api/workers/${encodeURIComponent(id)}`, { method: "DELETE", headers: getStaffHeaders() });
      if (handleStaffUnauthorized(res)) return;
      if (res.ok) await loadStaffWorkers();
    }

    function renderPartnerShopsAdminList() {
      const box = document.getElementById("partnerShopsAdminList");
      if (!box || !isSuperAdmin()) return;
      const partnerShops = state.shops.filter(s => s.slug && s.slug !== "main");
      box.innerHTML = partnerShops.length
        ? partnerShops.map(sh => {
            const cleanLoc = stripMarketLabel(sh.location || "Calabar") || "Calabar";
            const safeSlug = escapeJsAttr(sh.slug);
            return `
              <div class="col-md-4">
                <div class="dark-subpanel small">
                  <div class="fw-bold text-warning">${escapeHtml(sh.name)}</div>
                  <div class="text-secondary">Location: ${escapeHtml(cleanLoc)} • Slug: ${escapeHtml(sh.slug)}</div>
                  <div class="d-flex flex-wrap gap-1 mt-2">
                    <button type="button" class="btn btn-sm btn-outline-info py-0 px-2" onclick="enterPartnerStorefront('${safeSlug}')">View Store</button>
                    <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2" onclick="deletePartnerShop('${safeSlug}')">Remove</button>
                  </div>
                </div>
              </div>`;
          }).join("")
        : `<div class="col-12 text-secondary small">No partner businesses registered yet.</div>`;
    }

    async function deletePartnerShop(slug) {
      if (!isSuperAdmin() || !slug || slug === "main") return;
      const res = await fetch(`/api/shops/${encodeURIComponent(slug)}`, { method: "DELETE", headers: getStaffHeaders() });
      if (handleStaffUnauthorized(res)) return;
      if (res.ok) {
        if (state.selectedShopId === slug) await enterMainStorefront();
        await loadShops();
        renderPartnerShopsAdminList();
      }
    }

    async function loadStaffAnalytics(qShop) {
      try {
        const res = await fetch(`/api/analytics?shop_id=${qShop}`, { headers: getStaffHeaders() });
        if (handleStaffUnauthorized(res)) return;
        const data = await safeJson(res);
        if (res.ok) {
          document.getElementById("kpiRevenue").textContent = formatMoney(data.total_revenue || 0);
          document.getElementById("kpiProfit").textContent = formatMoney(data.gross_profit || 0);
          document.getElementById("kpiExpenses").textContent = formatMoney(data.total_expenses || 0);
          document.getElementById("kpiCashflow").textContent = formatMoney(data.net_cashflow || 0);
        }
      } catch {
        // Ignore transient analytics errors
      }
    }

    // ========================================================================
    // 14. APPLICATION BOOTSTRAP
    // ========================================================================
    document.addEventListener("DOMContentLoaded", async () => {
      applyColorTheme(COLOR_THEMES[0]);
      addSpecialRequestRow();
      updateTipDisplay();
      restartTipRotation(10);
      startLiveChatPolling();

      document.getElementById("customerChatModal")?.addEventListener("shown.bs.modal", () => {
        renderCustomerChatMessages(true);
      });

      document.getElementById("tab-orders-chat")?.addEventListener("shown.bs.tab", async () => {
        renderStaffChatThreads();
        renderStaffChatMessages(true);
        if (isStaffLoggedIn()) {
          await loadStaffMessages(encodeURIComponent(state.staffShopId || "main"), true);
        }
      });

      await loadSettings();
      await loadShops();
      await enterMainStorefront();
      updateCartBadge();
      syncHeaderState(false);
    });
  </script>
</body>
</html>
